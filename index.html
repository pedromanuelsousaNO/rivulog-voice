function fitText(ctx,text,maxWidth,startSize,minSize,style=''){
  let size=startSize;
  do{
    ctx.font=`${style}${size}px Arial`;
    if(ctx.measureText(text).width<=maxWidth)return size;
    size-=1;
  }while(size>=minSize);
  return minSize;
}

function labelWrapLines(ctx,text,maxWidth,maxLines=2){
  const words=String(text||'').trim().split(/\s+/).filter(Boolean);
  if(!words.length)return [];
  const lines=[];
  let line='';
  while(words.length){
    const word=words.shift();
    const test=line?line+' '+word:word;
    if(ctx.measureText(test).width<=maxWidth||!line){
      line=test;
    }else{
      lines.push(line);
      line=word;
      if(lines.length===maxLines-1)break;
    }
  }
  if(words.length){
    line += (line?' ':'') + words.join(' ');
    while(ctx.measureText(line+'…').width>maxWidth && line.length>2)line=line.slice(0,-1);
    line=line.replace(/\s+$/,'')+'…';
  }
  if(line)lines.push(line);
  return lines.slice(0,maxLines);
}
function drawLabel(x,qrImg,customCanvas){
  const c=customCanvas||document.getElementById('labelcanvas'),ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#000';ctx.imageSmoothingEnabled=false;ctx.textBaseline='alphabetic';
  if(x.type!=='Tank'){
  const margin=14;
  const fullWidth=356;
  const leftWidth=198;
  const qrSize=150;
  const qrX=220;

  // Species/tank title: deliberately large for thermal printing.
  let titleSize=fitText(ctx,x.title||'',fullWidth,32,22,x.italicTitle?'italic bold ':'bold ');
  ctx.font=`${x.italicTitle?'italic ':''}bold ${titleSize}px Arial`;
  ctx.fillText(x.title||'',margin,38);
  ctx.fillRect(margin,50,fullWidth,2);

  // Primary code / rack information.
  if(x.line1){
    let s=fitText(ctx,x.line1,fullWidth,21,17,x.italicLine1?'italic bold ':'bold ');
    ctx.font=`${x.italicLine1?'italic ':''}bold ${s}px Arial`;
    ctx.fillText(x.line1,margin,80);
  }

  // Locality / secondary description gets the FULL label width and can wrap.
  let line2Bottom=112;
  if(x.line2){
    ctx.font='bold 19px Arial';
    const lines=labelWrapLines(ctx,x.line2,fullWidth,2);
    lines.forEach((line,i)=>ctx.fillText(line,margin,108+i*23));
    line2Bottom=108+(lines.length-1)*23;
  }

  // QR starts lower when we need two full-width description lines.
  const qrY=Math.max(132,line2Bottom+18);
  ctx.fillStyle='#fff';
  ctx.fillRect(qrX-4,qrY-4,qrSize+8,qrSize+8);
  ctx.drawImage(qrImg,qrX,qrY,qrSize,qrSize);

  // Generation/counts/status to the left of the QR.
  if(x.line3){
    ctx.fillStyle='#000';
    ctx.font='bold 19px Arial';
    const lines=labelWrapLines(ctx,x.line3,leftWidth,3);
    lines.forEach((line,i)=>ctx.fillText(line,margin,qrY+28+i*24));
  }

  // Only the brand remains in the footer; the internal record type is no longer printed.
  ctx.fillStyle='#000';
  ctx.font='bold 14px Arial';
  ctx.fillText('RivuLog',margin,288);
  return;
  }
  // Identical cut-line positions, tank number and QR coordinates on EVERY tank label.
  ctx.fillRect(4,2,376,1);ctx.fillRect(4,298,376,1);
  ctx.font='bold 17px Arial';ctx.fillText('TANK',13,46);
  ctx.font='bold 62px Arial';ctx.fillText(x.tankNumber||String(x.id||'').replace(/\D/g,''),12,112);
  // Fixed 156x156 dot QR (with white surround) on 384-dot print width.
  ctx.fillStyle='#fff';ctx.fillRect(219,67,160,160);
  ctx.drawImage(qrImg,222,70,154,154);ctx.fillStyle='#000';
  const full=String(x.fishName||'Available tank');
  ctx.font='bold 16px Arial';
  const words=full.split(/\s+/),lines=[];let line='';
  words.forEach(w=>{const trial=(line?line+' ':'')+w;if(ctx.measureText(trial).width>194&&line){lines.push(line);line=w}else line=trial});
  if(line)lines.push(line);
  if(lines.length>5 || lines.some(l=>ctx.measureText(l).width>195))throw new Error('Full species identification does not fit this label. Increase label height before printing.');
  lines.forEach((l,i)=>ctx.fillText(l,13,145+i*22));
  const countText=String(x.line2 || (x.quantity ? x.quantity+' fish' : (x.fishName ? 'Occupied · count not recorded' : 'Empty')));
  ctx.font='bold 17px Arial';
  if(ctx.measureText(countText).width>194)ctx.font='bold 12px Arial';
  ctx.fillText(countText,13,264);
  ctx.font='13px Arial';ctx.fillText(x.stockedDate?'Stocked: '+x.stockedDate:'',13,283);
}

function initialEmbeddedBoot(){
  const state=document.getElementById('refreshState');
  try{
    const errEl=document.getElementById('rivuBootstrapError');
    const dataEl=document.getElementById('rivuBootstrap');
    const startupError=JSON.parse((errEl&&errEl.textContent)||'""');
    if(startupError)throw new Error(startupError);

    // Backwards compatible with an older deployment that still embeds data.
    const embedded=JSON.parse((dataEl&&dataEl.textContent)||'null');
    if(embedded&&typeof embedded==='object'){
      DATA=embedded;BOOT_DONE=true;saveStartupCache(DATA);render();
      if(state)state.textContent='Loaded '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      return;
    }

    const cached=readStartupCache();
    if(cached){
      DATA=cached.data;BOOT_DONE=true;STARTUP_SYNCING=true;render();
      const ageMin=Math.max(0,Math.round((Date.now()-Number(cached.savedAt||Date.now()))/60000));
      if(state)state.textContent=(ageMin<1?'Cached now':`Cached ${ageMin}m`)+' • syncing…';
      setTimeout(()=>refreshAll({silent:true,startup:true}).catch(e=>console.warn('Startup background refresh:',e)),30);
      return;
    }

    // First visit on this browser: paint the shell immediately, then fetch data.
    BOOT_DONE=false;STARTUP_SYNCING=true;
    const app=document.getElementById('app');
    if(app)app.innerHTML='<div class="card"><b>RivuLog is ready.</b><div class="small section">Loading current fishroom data for this browser…</div></div>';
    if(state)state.textContent='Connecting…';
    setTimeout(()=>refreshAll({initial:true,silent:true,startup:true}).catch(e=>showBootError(errMsg(e))),0);
  }catch(e){
    BOOT_DONE=false;STARTUP_SYNCING=false;
    showBootError(errMsg(e));
  }
}

  receiveBleMeasurement=async function(msg,sourceWindow){
    const tank=msg?.tankId||WATER_SELECTED_TANK;
    if(!wxIsSharedTank(tank))return baseReceiveBleMeasurement(msg,sourceWindow);
    try{
      if(!msg||msg.type!=='RIVULOG_BLE_MEASUREMENT')return;
      const messageId=String(msg.messageId||'');
      if(!tank)throw new Error('No incubator was supplied by RivuLog Meter.');
      if(WATER_SELECTED_TANK&&String(tank)!==String(WATER_SELECTED_TANK))throw new Error(`Meter returned ${tankName(tank)}, but ${tankName(WATER_SELECTED_TANK)} is selected in RivuLog.`);
      if(messageId&&WATER_SAVED_MESSAGE_IDS.has(messageId)){
        try{sourceWindow?.postMessage({type:'RIVULOG_MEASUREMENT_ACK',ok:true,messageId,tankId:tank,duplicate:true},bleBridgeOrigin())}catch(e){}
        return;
      }
      WATER_SAVE_PENDING=true;renderWaterTesting();
      const st=document.getElementById('bleReturnState');if(st)st.textContent='Saving shared incubator water #44–#50…';
      await gas('wxAddSharedWaterTest',{
        DateTime:msg.measuredAt||new Date().toISOString(),pH:msg.pH,EC_uScm:msg.EC_uScm,TDS_ppm:msg.TDS_ppm,Temperature_C:msg.Temperature_C,
        ORP_mV:'',DO_mgL:'',Salinity_pct:'',Source:'RivuLog BLE direct',
        Notes:`BLE-9908 shared incubator water #44–#50${msg.stabilizationTimedOut?' • 15s max':msg.stable?' • stable':''}${msg.clipped?' • meter range limit':''}${msg.rawHex?' • raw '+msg.rawHex:''}`
      });
      if(messageId)WATER_SAVED_MESSAGE_IDS.add(messageId);
      await wxRefreshState();
      WATER_SAVE_PENDING=false;renderWaterTesting();
      if(st)st.textContent='Saved in RivuLog ✓ — shared incubator water #44–#50';
      try{sourceWindow?.postMessage({type:'RIVULOG_MEASUREMENT_ACK',ok:true,messageId,tankId:tank},bleBridgeOrigin())}catch(e){}
      toast('Shared incubator water saved for #44–#50');
    }catch(e){
      WATER_SAVE_PENDING=false;renderWaterTesting();
      const st=document.getElementById('bleReturnState');if(st)st.textContent=`Save failed: ${errMsg(e)}`;
      try{sourceWindow?.postMessage({type:'RIVULOG_MEASUREMENT_ACK',ok:false,messageId:String(msg?.messageId||''),tankId:msg?.tankId||'',error:errMsg(e)},bleBridgeOrigin())}catch(x){}
      toast(errMsg(e),'error');
    }
  };

  function wxCalibrationStatusHtml(){

    let cls='warn',headline='Calibration recommended',detail='No calibration has been recorded yet.';
    if(last&&days===0){cls='ok';headline='Calibrated today ✓';detail=[last.Parameters,last.Standards].filter(Boolean).join(' • ')}
    else if(last&&c.due&&skipped){cls='';headline='Reminder skipped today';detail=`Last calibration ${days} day${days===1?'':'s'} ago${last.Parameters?' • '+last.Parameters:''}`}
    else if(last&&c.due){headline='Calibration recommended';detail=`${days} day${days===1?'':'s'} since last calibration${last.Parameters?' • '+last.Parameters:''}`}
    else if(last){cls='ok';headline='Calibration current';detail=`Last calibrated ${days} day${days===1?'':'s'} ago${last.Parameters?' • '+last.Parameters:''}`}
    const skip=(c.due&&!skipped)?'<button class="btn" onclick="wxSkipCalibrationToday()">Skip reminder today</button>':'';
    const standards=last?.Standards||'No standards recorded';
    return `<div class="water-cal-wrap"><div class="water-cal-status ${cls}"><div class="fishroom-eyebrow">METER CALIBRATION</div><div class="water-cal-big">${esc(headline)}</div><div class="small">${esc(detail)}</div><div class="tiny section">Reminder after ${esc(limit)} days • advisory only — calibration never blocks measurement.</div></div><div><div class="between"><div><h3 style="margin:0">BLE-9908 calibration record</h3><div class="small">Record the standard set and only the calibration points actually used.</div></div><div class="row"><button class="btn primary" onclick="wxRecordCalibrationForm()">+ Record calibration</button>${skip}<button class="btn" onclick="wxCalibrationReminderForm()">Reminder: ${esc(limit)}d</button></div></div><div class="water-cal-meta section"><div><span>Parameters</span><b>${esc(last?.Parameters||'—')}</b></div><div><span>Standards / points</span><b>${esc(standards)}</b></div><div><span>Last calibration</span><b>${last?.DateTime?esc(fmt(last.DateTime,true)):'—'}</b></div><div><span>Status</span><b class="${cls==='ok'?'oktext':cls==='warn'?'warntext':''}">${esc(headline)}</b></div></div></div></div>`;

  window.wxSaveCalibration=async function(){
    try{
      const params=[];
      const hasPH=!!document.getElementById('wxCalPH')?.checked,hasEC=!!document.getElementById('wxCalEC')?.checked,hasTemp=!!document.getElementById('wxCalTemp')?.checked;
      if(hasPH)params.push('pH');if(hasEC)params.push('EC/TDS');if(hasTemp)params.push('Temperature');
      if(!params.length)throw new Error('Choose at least one calibrated parameter.');
      const standards=[];
      if(hasPH){
        const set=document.querySelector('input[name="wxCalSet"]:checked')?.value||'Asian';
        let pts=[];
        if(set==='Asian'||set==='European')pts=[...document.querySelectorAll('.wxCalPoint:checked')].map(x=>x.value);
        else pts=['wxCalCustom1','wxCalCustom2','wxCalCustom3'].map(id=>v(id)).filter(Boolean).map(x=>Number(x).toFixed(2));
        if(!pts.length)throw new Error('Select or enter at least one pH calibration point.');
        standards.push(`pH: ${set} standard — ${pts.length} point${pts.length===1?'':'s'} — ${pts.join(' + ')} used`);
      }
      if(hasEC){const s=v('wxCalECStandard');if(!s)throw new Error('Enter the EC / TDS standard solution used.');standards.push(`EC/TDS: ${s}`)}
      if(hasTemp)standards.push('Temperature calibration recorded');
      await gas('wxAddMeterCalibration',{DateTime:v('wxCalDate'),MeterID:'BLE-9908',Parameters:params.join(', '),Standards:standards.join('; '),Notes:v('wxCalNotes')});
      closeModal();await wxRefreshState();wxRenderCalibrationPanel();wxRenderWaterKpis();toast('Calibration recorded');
    }catch(e){toast(errMsg(e),'error')}
  };

  window.wxWaterTrendRefresh=async function(){
    const host=document.getElementById('wxTrendCharts'),notice=document.getElementById('wxTrendNotice'),tank=document.getElementById('wxTrendTank')?.value;if(!host||!tank)return;
    const keys=wxTrendSelectedKeys();if(!keys.length){host.className='wx-trend-grid';host.innerHTML='<div class="dash-empty">Select at least one parameter.</div>';if(notice)notice.textContent='';return}
    const token=++WX_TREND_TOKEN;host.className='wx-trend-grid'+(keys.length===1?' one':'');host.innerHTML='<div class="dash-empty">Loading water history…</div>';if(notice)notice.textContent='Loading…';
    try{
      const sharedCircuit=wxIsSharedTank(tank);
      const opts={};if(WX_TREND_DAYS)opts.from=new Date(Date.now()-WX_TREND_DAYS*86400000).toISOString();
      const r=sharedCircuit?await gas('wxGetSharedWaterSeries',opts):await gas('getTankWaterSeries',tank,Object.assign({allCycles:true},opts));if(token!==WX_TREND_TOKEN||current!=='Water')return;
      const count=keys.reduce((n,k)=>n+(r.series?.[k]?.length||0),0);
      if(notice){
        const range=WX_TREND_DAYS?WX_TREND_DAYS+' day view':'all history';
        notice.textContent=count?(sharedCircuit?`${r.dataRange?.selectedTests||0} shared-water reading(s) • Incubators #44–#50 • ${range} • selecting any incubator shows this same circuit history`:`${r.dataRange?.selectedTests||0} water-test row(s) • ${range} • separate scales per parameter`):(sharedCircuit?'No shared-water readings match this selection.':'No readings match this selection.');
      }
      host.innerHTML=(sharedCircuit?`<div class="wx-shared-trend-note"><b>Shared water circuit</b><span>Incubators #44–#50 • one measurement represents all seven incubators</span></div>`:'')+keys.map((k,i)=>{const [label,suffix]=wxTrendDef(k),a=r.series?.[k]||[],last=a.length?a[a.length-1].value:null;return `<div class="wx-trend-card"><h4>${esc(label)}${last!==null?`<span class="wx-trend-latest">${esc(last)}${esc(suffix)}</span>`:''}</h4>${a.length?`<div class="chartwrap"><canvas id="wxTrendChart_${i}"></canvas></div>`:`<div class="nodata">No ${esc(label)} readings in this range</div>`}</div>`}).join('');
      let chartOk=true;try{await ensureChartLib()}catch(e){chartOk=false}
      if(token!==WX_TREND_TOKEN||current!=='Water')return;
      keys.forEach((k,i)=>{const a=r.series?.[k]||[];if(!a.length)return;const [label,suffix]=wxTrendDef(k),card=document.getElementById('wxTrendChart_'+i)?.closest('.wx-trend-card');if(!chartOk){if(card)card.innerHTML=`<h4>${esc(label)}</h4>${nativeWaterChart(a,label)}`;return}const canvas=document.getElementById('wxTrendChart_'+i);if(!canvas)return;const chart=new Chart(canvas,{type:'line',data:{labels:a.map(x=>x.date),datasets:[{label,data:a.map(x=>x.value),borderWidth:2,pointRadius:2,tension:.18,fill:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${label}: ${c.parsed.y}${suffix}`}}},scales:{x:{ticks:{maxTicksLimit:6,callback:function(val){const s=this.getLabelForValue(val);return s?fmt(s):''}}},y:{title:{display:true,text:label+suffix}}}}});CHARTS.push(chart)});
    }catch(e){if(token!==WX_TREND_TOKEN)return;host.innerHTML=`<div class="dash-empty"><span class="warntext">Could not load trend data.</span><div class="small">${esc(errMsg(e))}</div></div>`;if(notice)notice.textContent=''}
  };

  };

<script id="rivulog-v472-dashboard-trends-js">
(function(){
  let DASH_TREND_DAYS=30, DASH_TREND_TOKEN=0, DASH_TREND_CHARTS=[];
  const DASH_TREND_META={
    waterReadings:{label:'Water readings',sub:'Normal WaterTests + one record per shared incubator reading',page:'Water'},
    eggBatches:{label:'Egg batches collected',sub:'Egg batches by collection date',page:'Egg Batches'},
    fryGroups:{label:'Fry groups started',sub:'New fry groups by start date',page:'Fry'},
    healthEvents:{label:'Health events opened',sub:'Health events by start date',page:'Health'}
  };

  function dashTrendKeys(){return Object.keys(DASH_TREND_META).filter(k=>document.getElementById('dashTrend_'+k)?.checked)}
  function dashTrendDestroyCharts(){
    DASH_TREND_CHARTS.forEach(c=>{try{c.destroy()}catch(e){}});
    if(typeof CHARTS!=='undefined'&&DASH_TREND_CHARTS.length){const dead=new Set(DASH_TREND_CHARTS);for(let i=CHARTS.length-1;i>=0;i--)if(dead.has(CHARTS[i]))CHARTS.splice(i,1)}
    DASH_TREND_CHARTS=[];
  }
  function dashTrendDateLabel(value,bucket){
    const d=new Date(value);if(isNaN(d))return String(value||'');
    return bucket==='month'?d.toLocaleDateString(undefined,{month:'short',year:'2-digit'}):d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
  }
  function dashTrendTotalCard(k,n){const m=DASH_TREND_META[k];return `<div class="dash-trend-total" onclick="showPage('${m.page}')" style="cursor:pointer"><span>${esc(m.label)}</span><b>${esc(n??0)}</b></div>`}

  window.dashSetSystemTrendRange=function(days){
    DASH_TREND_DAYS=Number(days)||0;
    [7,30,90,0].forEach(n=>document.getElementById('dashTrendRange'+n)?.classList.toggle('active',n===DASH_TREND_DAYS));
    dashboardSystemTrendsRefresh();
  };

  window.dashboardSystemTrendsRefresh=async function(){
    const host=document.getElementById('dashTrendCharts'),notice=document.getElementById('dashTrendNotice'),totalsHost=document.getElementById('dashTrendTotals');
    if(!host||current!=='Dashboard')return;
    const keys=dashTrendKeys();
    dashTrendDestroyCharts();
    if(!keys.length){host.className='dash-trend-grid';host.innerHTML='<div class="dash-empty">Select at least one system metric.</div>';if(totalsHost)totalsHost.innerHTML='';if(notice)notice.textContent='';return}
    const token=++DASH_TREND_TOKEN;host.className='dash-trend-grid'+(keys.length===1?' one':'');host.innerHTML='<div class="dash-empty">Loading system history…</div>';if(notice)notice.textContent='Loading…';
    try{
      const r=await gas('wxGetDashboardSystemTrends',{days:DASH_TREND_DAYS});
      if(token!==DASH_TREND_TOKEN||current!=='Dashboard')return;
      const totals=r.totals||{};
      if(totalsHost)totalsHost.innerHTML=keys.map(k=>dashTrendTotalCard(k,totals[k]||0)).join('');
      const rangeText=DASH_TREND_DAYS?`${DASH_TREND_DAYS} day view`:'all history';
      if(notice)notice.textContent=`${rangeText} • ${r.bucket==='month'?'monthly':'daily'} buckets${r.invalidDates?` • ${r.invalidDates} row(s) with invalid dates ignored`:''}`;
      host.innerHTML=keys.map((k,i)=>{const m=DASH_TREND_META[k],a=r.series?.[k]||[],total=totals[k]||0;return `<div class="dash-trend-card"><div class="dash-trend-card-head"><div><h4>${esc(m.label)}</h4><div class="tiny">${esc(m.sub)}</div></div><button class="btn" onclick="showPage('${m.page}')">Open</button></div>${total?`<div class="chartwrap"><canvas id="dashSystemTrendChart_${i}"></canvas></div>`:`<div class="dash-trend-zero">No ${esc(m.label.toLowerCase())} in this range</div>`}<div class="dash-trend-foot"><span>Total in range: <b>${esc(total)}</b></span>${k==='waterReadings'?`<span>${esc(r.waterBreakdown?.normal||0)} normal + ${esc(r.waterBreakdown?.shared||0)} shared-circuit</span>`:''}</div></div>`}).join('');
      let chartOk=true;try{await ensureChartLib()}catch(e){chartOk=false}
      if(token!==DASH_TREND_TOKEN||current!=='Dashboard')return;
      keys.forEach((k,i)=>{
        const a=r.series?.[k]||[],total=totals[k]||0,m=DASH_TREND_META[k];if(!total)return;
        const card=document.getElementById('dashSystemTrendChart_'+i)?.closest('.dash-trend-card');
        if(!chartOk){if(card){const nz=a.filter(x=>Number(x.value)>0);card.querySelector('.chartwrap').outerHTML=nativeWaterChart(nz.length?nz:a,m.label)}return}
        const canvas=document.getElementById('dashSystemTrendChart_'+i);if(!canvas)return;
        const chart=new Chart(canvas,{type:'line',data:{labels:a.map(x=>x.date),datasets:[{label:m.label,data:a.map(x=>x.value),borderWidth:2,pointRadius:a.length>45?0:2,pointHoverRadius:4,tension:.18,fill:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'nearest',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{title:items=>items?.length?dashTrendDateLabel(items[0].label,r.bucket):'',label:c=>`${m.label}: ${c.parsed.y}`}}},scales:{x:{ticks:{maxTicksLimit:7,callback:function(val){return dashTrendDateLabel(this.getLabelForValue(val),r.bucket)}}},y:{beginAtZero:true,ticks:{precision:0},title:{display:true,text:'Count'}}}}});
        DASH_TREND_CHARTS.push(chart);CHARTS.push(chart);
      });
    }catch(e){
      if(token!==DASH_TREND_TOKEN)return;host.innerHTML=`<div class="dash-empty"><span class="warntext">Could not load system trends.</span><div class="small">${esc(errMsg(e))}</div></div>`;if(totalsHost)totalsHost.innerHTML='';if(notice)notice.textContent='';
    }
  };

  let DASH_TREND_OBSERVER=null;
  function dashboardArmTrendLazyLoad(){
    if(DASH_TREND_OBSERVER){try{DASH_TREND_OBSERVER.disconnect()}catch(e){}DASH_TREND_OBSERVER=null}
    const host=document.getElementById('dashTrendCharts');
    if(!host||current!=='Dashboard')return;
    host.innerHTML='<div class="dash-empty">System trends load when this section comes into view.</div>';
    const run=()=>{if(current==='Dashboard')dashboardSystemTrendsRefresh()};
    if(!('IntersectionObserver' in window)){setTimeout(run,700);return}
    DASH_TREND_OBSERVER=new IntersectionObserver(entries=>{
      if(entries.some(x=>x.isIntersecting)){
        DASH_TREND_OBSERVER.disconnect();DASH_TREND_OBSERVER=null;run();
      }
    },{rootMargin:'220px 0px'});
    DASH_TREND_OBSERVER.observe(host);
  }

  const baseInit=initDashboardControlCenter;
  initDashboardControlCenter=async function(){
    await baseInit();
    if(current==='Dashboard'&&!STARTUP_SYNCING)dashboardArmTrendLazyLoad();
  };
})();
</script>
<script id="rv53-script">
/* RivuLog V5.3.0 — commands from an explicit HTTPS voice bridge window. */
(function(){
'use strict';
const VOICE_URL='https://pedromanuelsousano.github.io/rivulog-voice/';
const VOICE_ORIGIN=new URL(VOICE_URL).origin;
const desktop=()=>matchMedia('(min-width:800px) and (pointer:fine)').matches;
let bridge=null, token='', ready=false, last='None yet', status='Voice bridge is off', helpOpen=false;
const commands=[['Next tank','Select the next numbered tank'],['Previous tank','Select the previous numbered tank'],['Tank eighteen / Tank 18','Go directly to a tank'],['Show trend','Display existing tank water charts'],['Hide trend','Return to the selected tank'],['Repeat','Speak tank number and last saved measurement'],['Save','Not yet enabled: requires meter bridge update'],['Stop listening','Stop microphone on voice bridge'],['Close','Close the voice window']];
const escText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStatus(s){status=s;const e=document.getElementById('rv53-status');if(e)e.textContent=s;const h=document.getElementById('rv53-heard');if(h)h.textContent='Last heard: '+last;const b=document.getElementById('rv53-open');if(b)b.textContent=ready?'🎤 Voice connected':'🎤 Open voice bridge';}
function reply(type,extra={}){if(!bridge||bridge.closed)return;try{bridge.postMessage(Object.assign({type,token},extra),VOICE_ORIGIN)}catch(e){setStatus('Cannot reach voice bridge: '+e.message)}}
function tanks(){return (DATA.tanks||[]).filter(t=>Number.isFinite(waterTankNo(t))&&waterTankNo(t)<9999).sort((a,b)=>waterTankNo(a)-waterTankNo(b))}
function selectedNo(){const t=tanks().find(t=>String(t.TankID)===String(WATER_SELECTED_TANK));return t?waterTankNo(t):null}
function updateSelected(){const e=document.getElementById('rv53-selected');if(e)e.textContent=selectedNo()!=null?'TANK '+selectedNo():'No tank selected'}
function choose(t){if(WATER_SAVE_PENDING)return 'Saving in progress. Please wait.';if(!t)return 'Tank not found.';const rack=String(t.Rack||'Unassigned').trim()||'Unassigned';if(WATER_RACK!==rack){WATER_RACK=rack;const e=document.getElementById('waterRack');if(e)e.value=rack}selectWaterTank(t.TankID);updateSelected();return 'Tank '+waterTankNo(t)+' selected.'}
function showTrend(show){if(!WATER_SELECTED_TANK)return 'Please select a tank first.';const e=document.getElementById('wxTrendCharts'), section=e?.closest('.water-pro-trends')||e?.parentElement?.parentElement;if(!e)return 'Trends unavailable.';if(show){const s=document.getElementById('wxTrendTank');if(s)s.value=String(WATER_SELECTED_TANK);['pH','EC_uScm','TDS_ppm','Temperature_C'].forEach(k=>{const check=document.getElementById('wxTrend_'+k);if(check)check.checked=true});if(typeof wxWaterTrendRefresh==='function')wxWaterTrendRefresh();section?.scrollIntoView({behavior:'smooth',block:'start'});return 'Showing trends for tank '+selectedNo()+'.'}document.getElementById('waterSelectedPanel')?.scrollIntoView({behavior:'smooth',block:'center'});return 'Returned to live testing.'}
async function sendTrendsToVoice(){
 if(!WATER_SELECTED_TANK)return;
 const tank=String(WATER_SELECTED_TANK), no=selectedNo();
 reply('RV_VOICE_TRENDS',{loading:true,tank:no});
 try{
  const shared=typeof wxIsSharedTank==='function'&&wxIsSharedTank(tank);
  const rangeDays=typeof WX_TREND_DAYS!=='undefined'?Number(WX_TREND_DAYS)||0:30;
  const opts={};if(rangeDays)opts.from=new Date(Date.now()-rangeDays*86400000).toISOString();
  const r=shared?await gas('wxGetSharedWaterSeries',opts):await gas('getTankWaterSeries',tank,Object.assign({allCycles:true},opts));
  if(String(WATER_SELECTED_TANK)!==tank)return;
  const keys=['pH','EC_uScm','TDS_ppm','Temperature_C'],series={};
  for(const key of keys){series[key]=(r.series?.[key]||[]).map(p=>({date:String(p.date||p.x||''),value:Number(p.value)})).filter(p=>Number.isFinite(p.value)).slice(-300)}
  reply('RV_VOICE_TRENDS',{tank:no,series,shared,days:rangeDays,loading:false});
 }catch(e){reply('RV_VOICE_TRENDS',{tank:no,error:String(e?.message||e),loading:false})}
}
function handle(kind,num){if(current!=='Water')return 'Open the Water page first.';const a=tanks(),i=a.findIndex(t=>String(t.TankID)===String(WATER_SELECTED_TANK));switch(kind){case 'tank':return choose(a.find(t=>waterTankNo(t)===Number(num)));case 'next':return choose(a[i<0?0:i+1]);case 'previous':return choose(a[i-1]);case 'trend':{const result=showTrend(true);if(result.startsWith('Showing'))sendTrendsToVoice();return result;}case 'hideTrend':return showTrend(false);case 'repeat':{if(!WATER_SELECTED_TANK)return 'No tank selected.';const r=typeof waterLatestForTank==='function'?waterLatestForTank(WATER_SELECTED_TANK):null;return 'Tank '+selectedNo()+(r?'. Last saved P H '+(r.pH??'unknown')+', conductivity '+(r.EC_uScm??'unknown')+', T D S '+(r.TDS_ppm??'unknown')+', temperature '+(r.Temperature_C??'unknown'):'; no saved reading available.')}case 'save':return 'Save is not enabled until the meter bridge is updated and tested. No reading has been saved.';default:return 'Command not understood.'}}
window.rv53Open=function(){if(!desktop())return; if(bridge&&!bridge.closed){bridge.focus();setStatus('Voice bridge window is open.');return}token=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(16).padStart(2,'0')).join('');ready=false;const sw=Math.max(900,Math.floor(screen.availWidth||window.outerWidth||1280)),sh=Math.max(650,Math.floor(screen.availHeight||window.outerHeight||800));bridge=window.open(VOICE_URL,'rivulog_voice_bridge',`popup=yes,left=0,top=0,width=${sw},height=${sh}`);if(!bridge){setStatus('Pop-up blocked. Allow pop-ups for RivuLog and try again.');return}setStatus('Voice window opened. Waiting for connection…')};
window.rv53Help=function(force){helpOpen=typeof force==='boolean'?force:!helpOpen;const e=document.getElementById('rv53-help');if(e)e.hidden=!helpOpen};
window.rv53Trend=function(){setStatus(showTrend(true))};
window.addEventListener('message',e=>{if(e.origin!==VOICE_ORIGIN||e.source!==bridge)return;const m=e.data||{};if(m.type==='RV_VOICE_HELLO'){reply('RV_VOICE_INIT',{pageOrigin:location.origin});ready=true;setStatus('Voice bridge connected. Start microphone in the voice window.');return}if(!token||m.token!==token)return;if(m.type==='RV_VOICE_STATUS'){setStatus(String(m.status||'Voice ready'));return}if(m.type==='RV_VOICE_CMD'){last=String(m.heard||m.command||'');const result=handle(m.command,m.tank);setStatus('Heard: '+last+' — '+result);reply('RV_VOICE_ACK',{commandId:m.commandId,result,ok:!/(unavailable|not found|not enabled|not understood|no tank|Please select|Saving in progress)/i.test(result)});return}});
function inject(){if(current!=='Water'||!desktop())return;const host=document.querySelector('.water-pro-page')||document.getElementById('waterMeasure');if(!host)return;if(!document.getElementById('rv53-panel')){const p=document.createElement('div');p.id='rv53-panel';p.className='card rv53-panel';p.innerHTML='<div class="small">DESKTOP HANDS-FREE TESTING</div><div class="rv53-row"><div><div class="rv53-name" id="rv53-selected">No tank selected</div><div class="rv53-status" id="rv53-status">Voice bridge is off</div><div class="small" id="rv53-heard">Last heard: None yet</div></div><div class="rv53-actions"><button class="btn primary" id="rv53-open" onclick="rv53Open()">🎤 Open voice bridge</button><button class="btn" onclick="rv53Trend()">Show trend</button></div></div><div class="small section">Voice recognition runs in a separate HTTPS window. Save by voice is disabled until the meter bridge supports it.</div>';host.prepend(p)}if(!document.getElementById('rv53-side')){const b=document.createElement('button');b.id='rv53-side';b.className='btn rv53-side';b.textContent='? Voice commands';b.onclick=()=>window.rv53Help();document.body.appendChild(b)}if(!document.getElementById('rv53-help')){const p=document.createElement('div');p.id='rv53-help';p.className='card rv53-help';p.hidden=true;p.innerHTML='<div class="between"><h3>Voice commands</h3><button class="btn" onclick="rv53Help(false)">Close ×</button></div><table>'+commands.map(([a,b])=>'<tr><td>'+escText(a)+'</td><td>'+escText(b)+'</td></tr>').join('')+'</table><div class="small section">Keep the voice window open. Start microphone there once.</div>';document.body.appendChild(p)}updateSelected();setStatus(status)}
const oldRender=renderWaterTesting;renderWaterTesting=function(){oldRender();inject()};const oldSelect=selectWaterTank;selectWaterTank=function(id){oldSelect(id);updateSelected()};const observer=new MutationObserver(()=>{if(current==='Water'&&desktop())inject();else{const p=document.getElementById('rv53-help');if(p)p.hidden=true;helpOpen=false}});observer.observe(document.getElementById('app')||document.body,{childList:true,subtree:false});
})();
</script>
