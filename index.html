    @media(max-width:900px){.livefoods-grid{grid-template-columns:1fr}.livefoods-future{grid-template-columns:1fr}.livefoods-summary{grid-template-columns:1fr 1fr}}
    @media(max-width:650px){.livefoods-hero{grid-template-columns:1fr}.livefoods-hero-actions{justify-content:flex-start}.livefoods-summary{grid-template-columns:1fr}.livefood-todo{grid-template-columns:1fr}}


    /* ---- v4.8.0 Live Foods & Cultures operational workspace ---- */
    .lf-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lf-toolbar input{width:min(300px,100%)}.lf-toolbar select{width:auto;min-width:145px}
    .lf-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,.7fr);gap:12px;align-items:start}
    .lf-culture-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lf-culture-card{background:linear-gradient(145deg,#0b2024,#08191d);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0;display:flex;flex-direction:column;gap:11px}.lf-culture-card:hover{border-color:#39757c}
    .lf-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.lf-name{font-size:18px;font-weight:820}.lf-latin{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}.lf-badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.lf-badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:#0a1b1f;color:#cfe6e3}.lf-badge.active{border-color:#356d43;color:#bff0c8}.lf-badge.trial{border-color:#8d7430;color:#ffe0a0}.lf-badge.paused,.lf-badge.archived{color:var(--muted)}
    .lf-progress-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.lf-progress{height:6px;background:#071417;border-radius:999px;overflow:hidden;border:1px solid #17363c}.lf-progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}.lf-progress-row small{color:var(--muted);font-size:10px}
    .lf-fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}.lf-field{background:#07171a;border:1px solid #18383e;border-radius:9px;padding:9px;min-width:0}.lf-field b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#bcd7d4;margin-bottom:3px}.lf-field span{display:block;font-size:11px;color:var(--muted);line-height:1.35;white-space:pre-wrap}.lf-field.empty span{font-style:italic;opacity:.72}
    .lf-card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}.lf-card-actions .btn{padding:7px 9px;font-size:11px}
    .lf-side{display:grid;gap:12px;position:sticky;top:126px}.lf-activity-list{display:grid}.lf-activity{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #214148}.lf-activity:last-child{border-bottom:0}.lf-activity-icon{width:28px;height:28px;border-radius:9px;background:#0b2a2f;border:1px solid #235159;display:flex;align-items:center;justify-content:center;color:var(--accent);font-weight:850}.lf-activity b{display:block;font-size:12px}.lf-activity small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.lf-activity time{font-size:9px;color:var(--muted);white-space:nowrap}.lf-empty{padding:24px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:11px;background:#08191d}
    .lf-form-note{padding:10px 12px;border:1px solid var(--line);background:#08191d;border-radius:10px;color:var(--muted);font-size:11px;line-height:1.45}.lf-history-list{max-height:52vh;overflow:auto}.lf-history-row{padding:10px 0;border-bottom:1px solid #214148}.lf-history-row:last-child{border-bottom:0}.lf-history-row-head{display:flex;justify-content:space-between;gap:10px}.lf-history-row b{font-size:12px}.lf-history-row small{color:var(--muted);font-size:10px}.lf-history-row p{font-size:11px;color:#cfe1df;margin:5px 0 0;white-space:pre-wrap}
    @media(max-width:980px){.lf-layout{grid-template-columns:1fr}.lf-side{position:static;grid-template-columns:1fr 1fr}.lf-culture-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:720px){.lf-culture-grid,.lf-side,.lf-fields{grid-template-columns:1fr}.lf-toolbar input,.lf-toolbar select{width:100%}.livefoods-hero-actions .btn{width:100%}}


    /* ---- v4.8.1 Live Foods photo library ---- */
    .lf-card-photo{height:180px;border:1px solid #234850;border-radius:11px;background:#061316;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .lf-card-photo img{width:100%;height:100%;object-fit:contain;background:#061316}.lf-card-photo:hover{border-color:var(--accent)}
    .lf-photo-placeholder{width:100%;height:100%;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--muted);font-size:11px;background:linear-gradient(145deg,#07171a,#0a2025)}
    .lf-photo-placeholder b{display:block;color:#dff4f1;margin-bottom:4px}.lf-product-note{background:#0b252a;border:1px solid #285a62;border-radius:10px;padding:10px 11px}.lf-product-note b{display:block;font-size:11px;color:#dff7f3;margin-bottom:3px}.lf-product-note span{display:block;font-size:10px;line-height:1.45;color:#a9cfca}
    .lf-photo-summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.lf-photo-summary>div{background:#07171a;border:1px solid #18383e;border-radius:9px;padding:9px}.lf-photo-summary b{display:block;font-size:16px}.lf-photo-summary span{display:block;color:var(--muted);font-size:9px;margin-top:2px}
    .lf-photo-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.lf-photo-tile{border:1px solid var(--line);border-radius:12px;background:#08191d;overflow:hidden;min-width:0}.lf-photo-media{aspect-ratio:4/3;background:#061316;display:flex;align-items:center;justify-content:center;cursor:pointer;border-bottom:1px solid var(--line)}.lf-photo-media img{width:100%;height:100%;object-fit:contain}.lf-photo-copy{padding:10px}.lf-photo-copy b{display:block;font-size:12px}.lf-photo-copy p{font-size:10px;line-height:1.45;color:var(--muted);margin:5px 0 0;white-space:pre-wrap}.lf-photo-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.lf-photo-tag{font-size:9px;border:1px solid #2c545b;border-radius:999px;padding:3px 6px;color:#bad8d4}.lf-photo-tag.cover{border-color:#3d8050;color:#bdf3c8}.lf-photo-actions{display:flex;gap:5px;flex-wrap:wrap;padding:0 10px 10px}.lf-photo-actions .btn{font-size:10px;padding:6px 8px}
    .lf-drive-picker{display:grid;gap:8px}.lf-drive-file-note{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:#08191d;color:var(--muted);font-size:10px;line-height:1.4}.lf-drive-file-note.warn{border-color:#745d2c;color:#ffe0a0}.lf-drive-file-note.ok{border-color:#315e3d;color:#bff0c8}.lf-photo-modal-help{background:#07171a;border:1px solid #24464d;border-radius:10px;padding:10px 12px;color:#b7d3cf;font-size:10px;line-height:1.45}
    @media(max-width:720px){.lf-photo-gallery{grid-template-columns:1fr}.lf-card-photo{height:auto;min-height:180px}.lf-card-photo img{height:auto;max-height:360px}.lf-photo-summary{grid-template-columns:1fr 1fr}}

    .v503-photo-hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,15,19,.97) 0%,rgba(3,15,19,.88) 28%,rgba(3,15,19,.36) 57%,rgba(3,15,19,.12) 72%,rgba(3,15,19,.48) 100%)}
    .v503-photo-hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.18));pointer-events:none}
    .v503-photo-hero-inner{position:relative;z-index:1;min-height:320px;display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:28px;align-items:center;padding:32px 34px}
    .v503-photo-copy{max-width:610px;text-shadow:0 2px 16px rgba(0,0,0,.72)}
    .v503-photo-copy .fishroom-eyebrow{font-size:12px;letter-spacing:.18em;color:#50e0d3;font-weight:850}
    .v503-photo-title{font-size:42px;line-height:1.02;margin:8px 0 12px;letter-spacing:-.035em}
    .v503-photo-title span{color:var(--accent)}
    .v503-photo-lead{font-size:17px;line-height:1.55;color:#e2efed;max-width:570px}
    .v503-status-card{justify-self:end;width:100%;max-width:290px;border:1px solid rgba(79,209,197,.74);background:rgba(3,23,28,.78);backdrop-filter:blur(8px);border-radius:16px;padding:16px 17px;box-shadow:0 12px 28px rgba(0,0,0,.26)}
    .v503-status-date{padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14)}
    .v503-status-date b{display:block;font-size:15px}.v503-status-date span{display:block;margin-top:3px;color:#b5d4d0;font-size:11px;line-height:1.35}
    .v503-status-row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 0}
    .v503-status-icon{color:var(--accent);font-size:18px;text-align:center}.v503-status-row span{color:#c4ddda;font-size:12px}.v503-status-row b{font-size:18px}
    @media(max-width:900px){.v503-photo-hero-inner{grid-template-columns:1fr;padding:26px;gap:18px;align-items:end}.v503-status-card{justify-self:start;max-width:360px}.v503-photo-hero:before{background:linear-gradient(90deg,rgba(3,15,19,.96),rgba(3,15,19,.72) 48%,rgba(3,15,19,.28) 78%,rgba(3,15,19,.46))}}
    @media(max-width:650px){.v503-photo-hero{min-height:370px;border-radius:15px;background-position:58% 50%}.v503-photo-hero-inner{min-height:370px;padding:22px 18px 18px;align-content:end}.v503-photo-hero:before{background:linear-gradient(180deg,rgba(3,15,19,.12) 0%,rgba(3,15,19,.4) 38%,rgba(3,15,19,.95) 70%,rgba(3,15,19,.98) 100%)}.v503-photo-copy{align-self:end}.v503-photo-title{font-size:33px;margin:6px 0 8px}.v503-photo-lead{font-size:14px;line-height:1.45;max-width:100%}.v503-status-card{display:none}}
    /* RivuLog v4.6.3 — Fish Room Adaptive Photos */
    .dash-page{display:grid;gap:14px}
    .dash-hero{padding:20px;background:linear-gradient(135deg,rgba(0,201,190,.12),rgba(10,25,35,.45) 48%,rgba(34,113,255,.08));border-color:rgba(61,226,214,.22)}
    .dash-hero-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
    .dash-title{font-size:28px;line-height:1.08;margin:4px 0 7px}.dash-lead{max-width:780px;color:var(--muted);line-height:1.45}
    .dash-date{text-align:right;min-width:180px}.dash-date b{display:block;font-size:15px}.dash-date span{font-size:12px;color:var(--muted)}
    .dash-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:15px}
    .dash-kpi{border:1px solid var(--line);background:rgba(5,17,24,.48);border-radius:13px;padding:13px;min-height:96px;cursor:pointer;transition:.16s ease}
    .dash-kpi:hover{transform:translateY(-1px);border-color:rgba(61,226,214,.42);background:rgba(7,28,36,.72)}
    .dash-kpi .dash-kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.dash-kpi b{display:block;font-size:25px;margin:7px 0 3px}.dash-kpi small{color:var(--muted);line-height:1.25}
    .dash-grid-primary{display:grid;grid-template-columns:1.15fr 1.1fr .9fr;gap:12px}.dash-grid-secondary{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px}
    .dash-panel{min-width:0}.dash-panel h3{margin:0}.dash-panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.dash-panel-head .small{margin-top:3px}
    .dash-action{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.dash-action:first-child{border-top:0}.dash-action-icon{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(94,234,212,.1);font-size:12px}.dash-action.warn .dash-action-icon{background:rgba(255,193,7,.12);color:#ffd166}.dash-action.danger .dash-action-icon{background:rgba(255,90,110,.12);color:#ff7a8d}.dash-action.ok .dash-action-icon{background:rgba(60,216,140,.12);color:#5ce2a4}.dash-action .tiny{white-space:nowrap}
    .dash-empty{border:1px dashed var(--line);border-radius:11px;padding:14px;color:var(--muted);text-align:center}
    .dash-rack-row{padding:10px 0;border-top:1px solid var(--line)}.dash-rack-row:first-child{border-top:0}.dash-rack-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.dash-progress{height:6px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;margin-top:7px}.dash-progress>span{height:100%;display:block;background:linear-gradient(90deg,var(--accent),#56e6b1);border-radius:inherit}
    .dash-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.dash-metric{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(5,17,24,.35)}.dash-metric span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.dash-metric b{display:block;font-size:18px;margin-top:4px;overflow-wrap:anywhere}
    .dash-link-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.dash-note{padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(5,17,24,.3);margin-top:8px}.dash-note b{display:block;margin-bottom:3px}
    .dash-workspaces{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dash-workspace{border:1px solid var(--line);border-radius:12px;padding:13px;background:rgba(5,17,24,.34);display:flex;justify-content:space-between;gap:12px;align-items:center}.dash-workspace b{display:block}.dash-workspace .small{margin-top:3px}
    .dash-cal-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.dash-cal-line:first-child{border-top:0}.dash-cal-line span:first-child{color:var(--muted)}
    @media(max-width:1180px){.dash-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dash-grid-primary{grid-template-columns:1fr 1fr}.dash-grid-primary>.dash-panel:last-child{grid-column:1/-1}.dash-grid-secondary{grid-template-columns:1fr 1fr}}

function readingsTable(rows){rows=rows||[];if(!rows.length)return '<div class="small">No readings in this selection.</div>';const cols=[['pH','pH'],['EC_uScm','EC'],['TDS_ppm','TDS'],['Temperature_C','Temp °C'],['ORP_mV','ORP'],['DO_mgL','DO'],['Salinity_pct','Salt %']];return `<div class="tablewrap"><table><tr><th>Date</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Cycle</th></tr>${rows.slice().reverse().map(r=>`<tr><td>${esc(fmt(r.date,true))}</td>${cols.map(c=>`<td>${r[c[0]]===null||r[c[0]]===undefined?'':esc(r[c[0]])}</td>`).join('')}<td class="small">${esc(r.CycleID||'—')}</td></tr>`).join('')}</table></div>`}
function nativeWaterChart(data,label){
  if(!data||!data.length)return `<div class="nodata">No ${esc(label)} readings in the selected range</div>`;
  const W=760,H=250,L=52,R=16,T=18,B=38,vals=data.map(x=>Number(x.value)).filter(Number.isFinite);
  if(!vals.length)return `<div class="nodata">No ${esc(label)} readings in the selected range</div>`;
  let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}else{const pad=(hi-lo)*.08;lo-=pad;hi+=pad}
  const times=data.map(x=>new Date(x.date).getTime()),t0=Math.min(...times),t1=Math.max(...times);
  const x=(tm,i)=>t1===t0?L+(W-L-R)*(data.length===1?.5:i/Math.max(1,data.length-1)):L+(W-L-R)*(tm-t0)/(t1-t0);
  const y=v=>T+(H-T-B)*(hi-v)/(hi-lo);
  const pts=data.map((d,i)=>`${x(new Date(d.date).getTime(),i).toFixed(1)},${y(Number(d.value)).toFixed(1)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(f=>{const yy=T+(H-T-B)*f,val=hi-(hi-lo)*f;return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="rgba(158,195,191,.18)"/><text x="${L-7}" y="${yy+4}" text-anchor="end" fill="#9ec3bf" font-size="11">${esc(Number(val.toFixed(2)))}</text>`}).join('');
  const first=fmt(data[0].date),last=fmt(data[data.length-1].date);
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="${esc(label)} chart">${grid}<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#285057"/><polyline fill="none" stroke="#4fd1c5" stroke-width="2.5" points="${pts}"/>${data.map((d,i)=>`<circle cx="${x(new Date(d.date).getTime(),i)}" cy="${y(Number(d.value))}" r="2.6" fill="#eef8f7"><title>${esc(fmt(d.date,true))}: ${esc(d.value)}</title></circle>`).join('')}<text x="${L}" y="${H-10}" fill="#9ec3bf" font-size="11">${esc(first)}</text><text x="${W-R}" y="${H-10}" text-anchor="end" fill="#9ec3bf" font-size="11">${esc(last)}</text></svg></div>`;
}

function tankDetailLocal(id){
  const t=(DATA.tanks||[]).find(x=>x.TankID===id);
  if(!t)return null;
  const cached=TANK_DETAIL_CACHE[id]?.data;
  return {
    tank:t,
    activeCycle:t.cycle||cached?.activeCycle||null,
    recentWaterTests:cached?.recentWaterTests??null,
    cycles:cached?.cycles||[]
  };
}

function cacheTankDetail(id,d){
  if(!id||!d)return;
  TANK_DETAIL_CACHE[id]={data:d,loadedAt:Date.now()};
}

function invalidateTankDetail(id){
  if(id)delete TANK_DETAIL_CACHE[id];
}

async function refreshTankDetailBackground(id,force=false){
  const c=TANK_DETAIL_CACHE[id];
  if(!force&&c&&(Date.now()-c.loadedAt)<TANK_DETAIL_CACHE_MS)return;
  try{
    const d=await gas('getTankDetail',id);
    if(!d)return;
    cacheTankDetail(id,d);
    if(d.tank)replaceTankLocal(d.tank);
    if(ACTIVE_TANK_ID===id){
      const recent=document.getElementById('recentWaterHost');
      if(recent)recent.innerHTML=waterTable(d.recentWaterTests);
      const state=document.getElementById('recentWaterState');
      if(state)state.textContent='Updated';
    }
  }catch(e){
    if(ACTIVE_TANK_ID===id){
      const state=document.getElementById('recentWaterState');
      if(state)state.textContent='Could not refresh recent tests';
    }
  }
}

  const tc={total:tanks.length,available:0,occupied:0,cleaning:0,unavailable:0,other:0};
  tanks.forEach(t=>{
    const s=String(t.Status||'').toLowerCase();
    if(s==='available')tc.available++;
    else if(s==='occupied')tc.occupied++;
    else if(s==='cleaning')tc.cleaning++;
    else if(s==='unavailable')tc.unavailable++;

  });
  d.tanks=tc;
  d.activePopulations=(DATA.populations||[]).filter(p=>String(p.Status||'').toLowerCase()==='current').length;
  const eggs=DATA.eggBatches||[];

  d.incubatingEggBatches=eggs.filter(e=>String(e.Status||'').toLowerCase()==='incubating').length;
  d.activeFryGroups=(DATA.fryGroups||[]).filter(f=>String(f.Status||'').toLowerCase()==='active').length;
  d.openHealth=(DATA.health||[]).filter(h=>!['closed','resolved','recovered'].includes(String(h.Status||'').toLowerCase())).length;

function speciesPhotoSection(s={}){const photoUrl=speciesPhotoUrl(s),has=!!photoUrl;return `<div class="wide"><label>Photo</label><div class="row" style="align-items:flex-start;gap:14px;flex-wrap:wrap"><div id="speciesPhotoPreviewWrap" style="width:180px;height:120px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#08171a;display:flex;align-items:center;justify-content:center;overflow:hidden">${has?`<img id="speciesPhotoPreview" src="${esc(photoUrl)}" alt="Species photo" style="width:100%;height:100%;object-fit:cover">`:`<div id="speciesPhotoPreview" class="small" style="padding:10px;text-align:center;color:var(--muted)">No photo</div>`}</div><div style="flex:1;min-width:260px"><input id="speciesPhotoFile" type="file" accept="image/*" onchange="onSpeciesPhotoChosen(this)"><div id="speciesPhotoName" class="small" style="margin-top:8px">${has?'Current photo saved. Choose another image to replace it.':'Choose a JPG, PNG, WEBP or GIF image (max 8 MB).'}</div><div class="row" style="margin-top:10px">${s.SpeciesID&&has?`<button type="button" class="btn danger" onclick="removeSpeciesPhotoChoice()">Remove current photo</button>`:''}${has?`<button type="button" class="btn" onclick="restoreSpeciesPhotoChoice()">Restore current</button>`:''}</div><div class="small" style="margin-top:8px">Photos are stored in your Google Drive and shown in RivuLog.</div></div></div></div>`}

function setSpeciesPhotoPreview(src,caption){const p=document.getElementById('speciesPhotoPreview');const n=document.getElementById('speciesPhotoName');const wrap=document.getElementById('speciesPhotoPreviewWrap');if(!wrap)return;if(src){wrap.innerHTML=`<img id="speciesPhotoPreview" src="${esc(src)}" alt="Species photo" style="width:100%;height:100%;object-fit:cover">`;}else{wrap.innerHTML='<div id="speciesPhotoPreview" class="small" style="padding:10px;text-align:center;color:var(--muted)">No photo</div>';}if(n)n.textContent=caption||''}
async function onSpeciesPhotoChosen(input){
  const f=input?.files?.[0];
  if(!f)return;

  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(['heic','heif'].includes(ext)||/heic|heif/i.test(f.type||'')){
    input.value='';
    return toast('HEIC/HEIF is not supported. Please use JPG, PNG or WEBP.','warn');
  }
  if(!['jpg','jpeg','png','webp','gif'].includes(ext)&&!String(f.type||'').startsWith('image/')){
    input.value='';
    return toast('Choose a JPG, PNG, WEBP or GIF image.','warn');
  }

  const nameEl=document.getElementById('speciesPhotoName');
  if(nameEl)nameEl.textContent='Preparing photo…';

  try{
    const dataUrl=await new Promise((resolve,reject)=>{
      const rd=new FileReader();
      rd.onload=()=>resolve(String(rd.result||''));
      rd.onerror=()=>reject(new Error('Could not read the selected image'));
      rd.readAsDataURL(f);
    });

    const img=await new Promise((resolve,reject)=>{
      const im=new Image();
      im.onload=()=>resolve(im);
      im.onerror=()=>reject(new Error('Could not decode this image. Please use JPG, PNG or WEBP.'));
      im.src=dataUrl;
    });

    // RivuLog does not need the original multi-megapixel file.
    // Resize before google.script.run so saves are fast and reliable.
    const MAX_SIDE=1400;
    const scale=Math.min(1,MAX_SIDE/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
    const w=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
    const h=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,w,h);
    ctx.drawImage(img,0,0,w,h);

    const optimized=canvas.toDataURL('image/jpeg',0.82);
    const approxBytes=Math.round((optimized.length-optimized.indexOf(',')-1)*0.75);

    SPECIES_PENDING_PHOTO={
      fileName:(f.name.replace(/\.[^.]+$/,'')||'species-photo')+'.jpg',
      mimeType:'image/jpeg',
      dataUrl:optimized
    };
    SPECIES_REMOVE_PHOTO=false;
    setSpeciesPhotoPreview(
      optimized,
      `Ready: ${f.name} • ${w}×${h} • about ${Math.max(1,Math.round(approxBytes/1024))} KB`
    );
  }catch(e){
    input.value='';
    SPECIES_PENDING_PHOTO=null;
    toast(errMsg(e),'error');
    if(nameEl)nameEl.textContent='Photo preparation failed.';
  }
}

let refreshFollowUp=null;
async function refreshAll(opts={}){
  // Never two refreshes at once. A refresh requested while one is running (e.g. right after a save)
  // is queued ONCE and runs afterwards, so the screen never keeps data loaded before the save (stale response).
  if(refreshPromise){if(!refreshFollowUp)refreshFollowUp=refreshPromise.catch(()=>{}).then(()=>{refreshFollowUp=null;return refreshAll({...opts,silent:true})});return refreshFollowUp}
  const btn=document.getElementById('refreshBtn'),state=document.getElementById('refreshState');
  if(opts.startup)STARTUP_SYNCING=true;
  if(btn)btn.disabled=true;if(state)state.textContent=opts.startup&&BOOT_DONE?'Cached • syncing…':'Refreshing…';
  refreshPromise=(async()=>{
    try{
      if(opts.initial&&!BOOT_DONE){const app=document.getElementById('app');if(app)app.innerHTML='<div class="card"><b>Loading current RivuLog data…</b><div class="small section">The page is ready. Connecting to the database now…</div></div>'}
      const fresh=await gas('getBootstrap');
      DATA=fresh;
      // Rivulus catalog is lazy-loaded and deliberately absent from bootstrap.
      // A full refresh must therefore allow Wishlist to load it again.
      CATALOG_TRIED=false;
      BOOT_DONE=true;saveStartupCache(DATA);
      if(opts.startup)STARTUP_SYNCING=false;
      render();
      if(!opts.silent)toast('Data refreshed');
      if(state)state.textContent='Synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
      return DATA;
    }catch(e){
      if(opts.startup)STARTUP_SYNCING=false;
      if(state)state.textContent=BOOT_DONE?'Cached • sync failed':'Refresh failed';
      if(opts.startup&&BOOT_DONE&&current==='Dashboard')setTimeout(()=>initDashboardControlCenter(),50);
      if(!opts.silent||!BOOT_DONE)toast(errMsg(e),'error');
      throw e;
    }
  })().finally(()=>{refreshPromise=null;if(btn)btn.disabled=false});
  return refreshPromise;
}

function dashKpi(label,value,sub,page,raw=false){return `<div class="dash-kpi" onclick="showPage('${esc(page)}')"><div class="dash-kpi-label">${esc(label)}</div><b>${raw?value:esc(value)}</b><small>${raw?sub:esc(sub)}</small></div>`}
function dashMetric(label,value){return `<div class="dash-metric"><span>${esc(label)}</span><b>${esc(value??0)}</b></div>`}
function dashNum(v){const n=Number(v);return Number.isFinite(n)?n:null}
function dashDateObj(x){if(!x)return null;const d=new Date(x);return isNaN(d)?null:d}
function dashDateFrom(obj,keys){for(const k of keys){const d=dashDateObj(obj?.[k]);if(d)return d}return null}
function dashSameLocalDay(a,b=new Date()){return a&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dashFmtActivityDate(d){if(!d)return'';return dashSameLocalDay(d)?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function dashActionHtml(icon,title,sub,time,cls='',onclick=''){return `<div class="dash-action ${cls}"${onclick?` onclick="${onclick}" style="cursor:pointer"`:''}><div class="dash-action-icon">${icon}</div><div><b>${esc(title)}</b>${sub?`<div class="small">${esc(sub)}</div>`:''}</div><div class="tiny">${esc(time||'')}</div></div>`}

function dashboardBaseActivityHtml(){const rows=dashboardBaseActivity();return rows.length?rows.map(x=>dashActionHtml(x.icon,x.title,x.sub,dashFmtActivityDate(x.d),'',x.go)).join(''):'<div class="dash-empty">No dated breeding or health activity is available in the current bootstrap data.</div>'}

function dashboardRackSummaryHtml(measuredSet){
  const racks=(typeof PHYSICAL_RACKS!=='undefined'?PHYSICAL_RACKS:[]),byNo={};(DATA.tanks||[]).forEach(t=>{const n=tankNoLocal(t);if(Number.isFinite(n))byNo[n]=t});
  if(!racks.length)return '<div class="dash-empty">Rack mapping unavailable.</div>';
  return racks.map(r=>{const nums=(r.shelves||[]).flatMap(s=>s.nums||[]),ts=nums.map(n=>byNo[n]).filter(Boolean),m=ts.filter(t=>measuredSet.has(String(t.TankID))).length,pct=ts.length?Math.round(m/ts.length*100):0;return `<div class="dash-rack-row"><div class="dash-rack-top"><div><b>${esc(r.name)}</b><div class="small">${esc(r.description||'')}</div></div><div class="small"><b>${m} / ${ts.length}</b> measured</div></div><div class="dash-progress"><span style="width:${pct}%"></span></div></div>`}).join('')
}

async function initDashboardControlCenter(){
  if(current!=='Dashboard'||STARTUP_SYNCING)return;
  let normal=[],wx=null;
  try{
    const live=await gas('wxDashboardLiveState');
    normal=live?.water?.tests||[];
    wx=live?.extras||null;
  }catch(e){console.warn('Dashboard live status:',e)}
  if(current!=='Dashboard')return;
  const shared=(wx?.sharedTests||[]).slice().sort((a,b)=>new Date(a.DateTime)-new Date(b.DateTime));
  const sharedLatest=shared.length?shared[shared.length-1]:null;
  const measured=new Set((normal||[]).map(x=>String(x.TankID)));
  if(sharedLatest)['T44','T45','T46','T47','T48','T49','T50'].forEach(id=>measured.add(id));
  const tracked=(DATA.tanks||[]).filter(t=>Number.isFinite(tankNoLocal(t)));

function dashboardRenderWaterOverview(normal,sharedLatest,wx){
  const host=document.getElementById('dashWaterOverview');if(!host)return;
  const readings=[...(normal||[])];if(sharedLatest)readings.push(sharedLatest);
  const avg=k=>{const a=readings.map(x=>dashNum(x[k])).filter(x=>x!==null);return a.length?a.reduce((p,c)=>p+c,0)/a.length:null};
  const ph=avg('pH'),tds=avg('TDS_ppm'),temp=avg('Temperature_C');
  const latest=dashboardWaterRows(normal,sharedLatest)[0];
  host.innerHTML=`<div class="dash-metrics">${dashMetric('Avg pH',ph===null?'—':ph.toFixed(2))}${dashMetric('Avg TDS',tds===null?'—':Math.round(tds)+' ppm')}${dashMetric('Avg temp',temp===null?'—':temp.toFixed(1)+' °C')}</div>${latest?`<div class="dash-note"><b>Latest: ${esc(latest.label)}</b><span class="small">${esc(dashFmtActivityDate(latest.d))} • pH ${esc(latest.x.pH??'—')} • TDS ${esc(latest.x.TDS_ppm??'—')} • ${esc(latest.x.Temperature_C??'—')} °C</span></div>`:'<div class="dash-note"><b>No water readings today</b><span class="small">Open Water when you start the next testing session.</span></div>'}<div class="dash-note" id="dashCalibrationMini">${dashboardCalibrationMini(wx)}</div>`;
}
function dashboardCalibrationMini(wx){
  const c=wx?.calibration||{},last=c.latest;
  if(!last)return '<b class="warntext">Calibration: no record</b><span class="small">No meter calibration has been recorded yet.</span>';
  const days=c.daysSince;const title=days===0?'Calibration recorded today':`Calibration ${days} day${days===1?'':'s'} ago`;
  return `<b class="${c.due?'warntext':'oktext'}">${esc(title)}</b><span class="small">${esc(last.Parameters||'')}${last.Standards?' • '+esc(last.Standards):''}</span>`;
}

function dashboardRenderAttention(measured,tracked,wx,normal,sharedLatest){
  const host=document.getElementById('dashAttention');if(!host)return;
  const rows=[],open=DATA.dashboard?.openHealth||0,notReady=(DATA.dashboard?.tanks?.cleaning||0)+(DATA.dashboard?.tanks?.unavailable||0);
  if(open)rows.push(dashActionHtml('!','Open health events',`${open} unresolved event${open===1?'':'s'} in Health`,'','danger',"showPage('Health')"));
  const cal=wx?.calibration||{};let skipped=false;try{skipped=localStorage.getItem('rivulog_calibration_skip_day')===String(wx?.today||'')}catch(e){}
  if(cal.due&&!skipped)rows.push(dashActionHtml('⚗','Meter calibration reminder',cal.latest?`${cal.daysSince} days since last calibration`:'No calibration recorded','','warn',"showPage('Water')"));
  const measuredCount=tracked.filter(t=>measured.has(String(t.TankID))).length,missing=Math.max(0,tracked.length-measuredCount);
  if(measuredCount>0&&missing>0)rows.push(dashActionHtml('≈','Water testing session in progress',`${missing} tracked tank${missing===1?'':'s'} not measured today`,'','warn',"showPage('Water')"));
  else if(!measuredCount)rows.push(dashActionHtml('≈','No water session started today','No water readings have been recorded today','','',"showPage('Water')"));
  if(notReady)rows.push(dashActionHtml('□','Tanks not ready',`${notReady} tank${notReady===1?' is':'s are'} cleaning / unavailable`,'','',"showPage('Tanks')"));
  host.innerHTML=rows.length?rows.join(''):'<div class="dash-empty"><span class="oktext">✓ No attention items detected from the current records.</span></div>';
}

  const host=document.getElementById('dashActivity');if(!host)return;

  const last=wx?.calibration?.latest;if(last){const d=dashDateObj(last.DateTime);if(d)items.push({d,icon:'✓',title:'Meter calibration',sub:`${last.Parameters||''}${last.Standards?' • '+last.Standards:''}`,go:"showPage('Water')"})}
  items.sort((a,b)=>b.d-a.d);host.innerHTML=items.slice(0,7).map(x=>dashActionHtml(x.icon,x.title,x.sub,dashFmtActivityDate(x.d),'',x.go)).join('')||'<div class="dash-empty">No recent activity available.</div>';

async function initLiveFoods(force=false){
  if(LIVEFOODS_LOADING)return;
  if(LIVEFOODS_DATA&&!force){lfRenderWorkspace();setTimeout(()=>lfAutoRepairOversizedLinkedPhotos(),0);return}
  LIVEFOODS_LOADING=true;
  const grid=document.getElementById('lfCultureGrid');
  if(grid)grid.innerHTML='<div class="card"><div class="small">Loading live-food data…</div></div>';
  try{
    LIVEFOODS_DATA=await gas('lfGetData');
    if(current==='Live Foods'){lfRenderWorkspace();setTimeout(()=>lfAutoRepairOversizedLinkedPhotos(),0)}
  }catch(e){
    if(grid)grid.innerHTML=`<div class="card"><div class="dangertext"><b>Live Foods could not load.</b></div><div class="small section">${esc(errMsg(e))}</div><div class="small section">Make sure the new <b>LiveFoods.gs</b> file was added to Apps Script, save the project, then refresh.</div></div>`;
    toast(errMsg(e),'error');
  }finally{LIVEFOODS_LOADING=false}
}

function lfCultures(){return LIVEFOODS_DATA?.cultures||[]}
function lfLogs(){return LIVEFOODS_DATA?.logs||[]}
function lfPhotos(){return LIVEFOODS_DATA?.photos||[]}
function lfCulture(id){return lfCultures().find(x=>String(x.CultureID)===String(id))||null}
function lfPhotosForCulture(id){return lfPhotos().filter(p=>String(p.CultureID)===String(id)).slice().sort((a,b)=>(Number(a.SortOrder)||999)-(Number(b.SortOrder)||999)||String(a.FileName||'').localeCompare(String(b.FileName||'')))}
function lfCoverPhoto(id){const rows=lfPhotosForCulture(id);return rows.find(p=>p.IsCover===true||String(p.IsCover).toLowerCase()==='true')||rows[0]||null}
function lfDateObj(x){if(!x)return null;const d=new Date(x);return isNaN(d)?null:d}
function lfDateInput(x){const d=lfDateObj(x);return d?d.toISOString().slice(0,10):''}
function lfWhen(x){const d=lfDateObj(x);return d?d.toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}
function lfText(v,fallback='Not documented yet'){const s=String(v??'').trim();return s||fallback}
function lfCompleteness(c){const keys=['Setup','CultureFood','Maintenance','Harvest','FishFeeding','Frequency'];const done=keys.filter(k=>String(c?.[k]??'').trim()).length;return Math.round(done/keys.length*100)}
function lfStatusClass(s){const x=String(s||'').toLowerCase();return x==='active'?'active':x==='trial'?'trial':x==='archived'?'archived':'paused'}
function lfActivityIcon(type){const t=String(type||'').toLowerCase();if(t.includes('feed'))return '◉';if(t.includes('harvest'))return '↗';if(t.includes('maint'))return '⚙';if(t.includes('hatch'))return '✦';if(t.includes('breed'))return '≈';return '•'}
function lfFormatBytes(n){n=Number(n)||0;if(!n)return 'Unknown size';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(n<10240?1:0)+' KB';return (n/1048576).toFixed(n<10485760?1:0)+' MB'}
function lfPhotoPreviewReady(p){return Number(p?.SizeBytes||0)>0&&Number(p.SizeBytes)<=2*1024*1024}
function lfPhotoProduct(cultureId){return lfPhotosForCulture(cultureId).find(p=>String(p.Category||'').toLowerCase()==='product')||null}

function lfPhotoSlot(p,cls=''){
  if(!p)return '';
  const id=esc(p.FileID||''),title=esc(p.Title||p.FileName||'Culture photo');
  const cached=LIVEFOODS_IMAGE_CACHE[p.FileID];
  if(cached?.dataUrl)return `<div class="${cls}" data-lf-photo-file="${id}" onclick="lfZoomPhoto('${id}')"><img src="${cached.dataUrl}" alt="${title}"></div>`;
  const size=Number(p.SizeBytes||0),note=lfPhotoPreviewReady(p)?'Loading private photo…':size&&size<=LF_OPTIMIZE_SOURCE_LIMIT_BYTES?`Preparing optimized preview… (${esc(lfFormatBytes(size))})`:`Preview unavailable (${esc(lfFormatBytes(size))}). Source is above the automatic optimizer limit.`;
  return `<div class="${cls}" data-lf-photo-file="${id}" onclick="lfZoomPhoto('${id}')"><div class="lf-photo-placeholder"><div><b>${title}</b>${note}</div></div></div>`;
}
function lfUpdatePhotoSlots(){
  document.querySelectorAll('[data-lf-photo-file]').forEach(el=>{
    const id=el.getAttribute('data-lf-photo-file'),cached=LIVEFOODS_IMAGE_CACHE[id];if(!cached)return;
    if(cached.dataUrl){el.innerHTML=`<img src="${cached.dataUrl}" alt="Live food photo">`}
    else if(cached.error){el.innerHTML=`<div class="lf-photo-placeholder"><div><b>Preview unavailable</b>${esc(cached.error)}</div></div>`}
  });
}
async function lfLoadPhotoSlots(scope=document){
  const ids=[...new Set([...scope.querySelectorAll('[data-lf-photo-file]')].map(el=>el.getAttribute('data-lf-photo-file')).filter(id=>id&&!LIVEFOODS_IMAGE_CACHE[id]))];
  for(let i=0;i<ids.length;i+=4){
    const batch=ids.slice(i,i+4);try{const rows=await gas('lfGetPhotoImages',batch);(rows||[]).forEach(r=>{if(r?.fileId)LIVEFOODS_IMAGE_CACHE[r.fileId]={dataUrl:r.dataUrl||'',error:r.error||''}});lfUpdatePhotoSlots()}catch(e){console.warn('Live-food photos:',e)}
  }
}
function lfZoomPhoto(fileId){const c=LIVEFOODS_IMAGE_CACHE[fileId];if(!c?.dataUrl){toast(c?.error||'Photo preview is not loaded.','warn');return}document.body.insertAdjacentHTML('beforeend',`<div class="fishroom-zoom" onclick="this.remove()"><img src="${c.dataUrl}" alt="Live food photo"></div>`)}

function lfRenderWorkspace(){
  if(!LIVEFOODS_DATA)return;
  const cultures=lfCultures(),logs=lfLogs(),photos=lfPhotos();
  const active=cultures.filter(c=>['active','trial'].includes(String(c.Status||'').toLowerCase())).length;
  const cutoff=Date.now()-30*86400000;
  const logs30=logs.filter(l=>{const d=lfDateObj(l.DateTime);return d&&d.getTime()>=cutoff}).length;
  const needs=cultures.filter(c=>lfCompleteness(c)<100&&String(c.Status||'').toLowerCase()!=='archived').length;
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
  set('lfStatCultures',cultures.length);set('lfStatActive',active);set('lfStatLogs',logs30);set('lfStatNeeds',needs);
  const ps=document.getElementById('lfPhotoSummary');if(ps){const culturesWith=new Set(photos.map(p=>String(p.CultureID))).size;ps.innerHTML=`<div><b>${photos.length}</b><span>Photos linked</span></div><div><b>${culturesWith}</b><span>Cultures with photos</span></div>`}
  lfRenderCultures();lfRenderActivity();lfRenderDocumentationQueue();setTimeout(()=>lfLoadPhotoSlots(),0);
}

function lfRenderCultures(){
  const host=document.getElementById('lfCultureGrid');if(!host||!LIVEFOODS_DATA)return;
  const q=String(document.getElementById('lfSearch')?.value||'').trim().toLowerCase();
  const status=String(document.getElementById('lfStatusFilter')?.value||'').toLowerCase();
  let rows=lfCultures().filter(c=>{
    if(status&&String(c.Status||'').toLowerCase()!==status)return false;
    if(!q)return true;
    return [c.Name,c.ScientificName,c.Category,c.Status,c.Notes,c.IdentificationNote].some(v=>String(v||'').toLowerCase().includes(q));
  });
  rows.sort((a,b)=>{const sa=String(a.Status||''),sb=String(b.Status||'');if(sa!==sb)return sa.localeCompare(sb);return String(a.Name||'').localeCompare(String(b.Name||''))});
  if(!rows.length){host.innerHTML='<div class="lf-empty">No cultures match this filter.</div>';return}
  host.innerHTML=rows.map(lfCultureCard).join('');setTimeout(()=>lfLoadPhotoSlots(host),0);
}

async function lfSyncKnownBbsPhotos(cultureId){
  try{
    let r=await gas('lfSyncBbsProductPhotos'),optimized=0,replaced=0,failed=0;
    const pending=Array.isArray(r?.needsOptimization)?r.needsOptimization:[];
    for(const item of pending){
      if(!item?.canOptimize){failed++;continue}
      try{const file=await lfOptimizeDrivePhoto(item.fileId,true);optimized++;replaced+=Number(file?.replacedLinks||0)}catch(err){failed++;console.warn('BBS photo optimization:',err)}
    }
    if(optimized)r=await gas('lfSyncBbsProductPhotos');
    LIVEFOODS_DATA=null;LIVEFOODS_DRIVE_FILES=null;LIVEFOODS_IMAGE_CACHE={};await initLiveFoods(true);lfOpenPhotoManager(cultureId);
    const linked=Number(r?.linked||0),repaired=Number(r?.repaired||0),matched=Number(r?.matched||0);
    const changed=linked+repaired+replaced;
    if(failed)toast(`${changed?changed+' BBS photo'+(changed===1?'':'s')+' updated. ':''}${failed} photo${failed===1?'':'s'} could not be optimized automatically.`,'warn');
    else toast(changed?`${changed} BBS photo${changed===1?'':'s'} updated${optimized?' with automatic optimization':''}`:matched?'BBS photos are already linked and web-ready':'No matching BBS photos found in the Drive folder',changed||matched?'':'warn');
  }catch(e){toast(errMsg(e),'error')}
}

const LF_OPTIMIZE_SOURCE_LIMIT_BYTES=10*1024*1024;
const LF_OPTIMIZE_TARGET_BYTES=Math.floor(1.5*1024*1024);
const LF_OPTIMIZE_MAX_DIMENSION=1600;

async function lfOpenAddPhotoForm(cultureId,selectedFileId=''){
  const c=lfCulture(cultureId);if(!c)return;
  try{
    const data=await gas('lfListDrivePhotos');LIVEFOODS_DRIVE_FILES=data?.files||[];
    const files=LIVEFOODS_DRIVE_FILES;
    if(!files.length){toast('No image files found in Rivulog photos.','warn');return}
    const selected=(selectedFileId&&files.some(f=>String(f.fileId)===String(selectedFileId)))?selectedFileId:(files[0]?.fileId||'');
    const opts=files.map(f=>({value:f.fileId,label:`${f.fileName} — ${lfFormatBytes(f.sizeBytes)}${f.previewReady?'':' — auto-optimize'}`}));
    const cats=['Product','Culture setup','Feeding','Harvesting','Equipment','Other'];
    modal(`<div class="between"><div><h3>Add photo — ${esc(c.Name)}</h3><div class="small">Choose an image already saved in My Drive → Rivulog photos.</div></div><button class="btn" onclick="lfOpenPhotoManager('${esc(cultureId)}')">Back</button></div><div class="lf-drive-picker section">${sel('Drive photo','lfPhotoFile',opts,selected)}${sel('Category','lfPhotoCategory',cats,'Culture setup')}${inp('Title','lfPhotoTitle','text','','placeholder="e.g. Easy Fish Artemia eggs — 425 g"')}${ta('Caption / note','lfPhotoCaption','')}<label class="row" style="gap:8px"><input id="lfPhotoCover" type="checkbox" style="width:auto"><span>Use as cover photo</span></label><div id="lfPhotoFileNote" class="lf-drive-file-note"></div></div><div class="row section"><button class="btn primary" id="lfLinkPhotoBtn" onclick="lfSavePhotoLink('${esc(cultureId)}')">Link photo</button><button class="btn" onclick="lfOpenPhotoManager('${esc(cultureId)}')">Cancel</button></div>`);
    const el=document.getElementById('lfPhotoFile');if(el)el.onchange=()=>lfPhotoPickerChanged(cultureId);lfPhotoPickerChanged(cultureId);
  }catch(e){toast(errMsg(e),'error')}
}
function lfPhotoPickerChanged(cultureId){
  const id=v('lfPhotoFile'),f=(LIVEFOODS_DRIVE_FILES||[]).find(x=>String(x.fileId)===String(id)),el=document.getElementById('lfPhotoFileNote');if(!el||!f)return;
  if(f.previewReady){
    el.className='lf-drive-file-note ok';el.innerHTML=`✓ ${esc(lfFormatBytes(f.sizeBytes))} — ready for private in-app preview.`;
    return;
  }
  el.className='lf-drive-file-note warn';
  if(Number(f.sizeBytes||0)<=LF_OPTIMIZE_SOURCE_LIMIT_BYTES){
    el.innerHTML=`${esc(lfFormatBytes(f.sizeBytes))} — RivuLog will automatically create a smaller web-preview copy when you link this photo. The original will stay untouched.`;
  }else{
    el.innerHTML=`${esc(lfFormatBytes(f.sizeBytes))} — above the ${lfFormatBytes(LF_OPTIMIZE_SOURCE_LIMIT_BYTES)} automatic optimizer limit. Keep the original in Drive and add a smaller web copy.`;
  }
}
function lfDataUrlBytes(dataUrl){
  const s=String(dataUrl||''),i=s.indexOf(','),b=i>=0?s.slice(i+1):s;return Math.floor(b.length*3/4);
}
function lfImageFromDataUrl(dataUrl){
  return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('The selected image could not be opened for optimization.'));img.src=dataUrl});
}
function lfCanvasJpeg(img,width,height,quality){
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(width));canvas.height=Math.max(1,Math.round(height));
  const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('Image optimizer is not available in this browser.');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(img,0,0,canvas.width,canvas.height);
  return {dataUrl:canvas.toDataURL('image/jpeg',quality),width:canvas.width,height:canvas.height};
}
async function lfOptimizeImageDataUrl(dataUrl){
  const img=await lfImageFromDataUrl(dataUrl),iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)throw new Error('Could not determine image dimensions.');
  let scale=Math.min(1,LF_OPTIMIZE_MAX_DIMENSION/Math.max(iw,ih)),w=Math.max(1,Math.round(iw*scale)),h=Math.max(1,Math.round(ih*scale)),quality=.84,result=lfCanvasJpeg(img,w,h,quality);
  for(let pass=0;pass<8&&lfDataUrlBytes(result.dataUrl)>LF_OPTIMIZE_TARGET_BYTES;pass++){
    if(quality>.56){quality=Math.max(.56,quality-.07)}else{
      const ratio=Math.max(.68,Math.min(.92,Math.sqrt(LF_OPTIMIZE_TARGET_BYTES/lfDataUrlBytes(result.dataUrl))*.95));w=Math.max(640,Math.round(w*ratio));h=Math.max(1,Math.round(w*ih/iw));
    }
    result=lfCanvasJpeg(img,w,h,quality);
  }
  result.sizeBytes=lfDataUrlBytes(result.dataUrl);return result;
}
async function lfOptimizeDrivePhoto(fileId,replaceLinks=false){
  const source=await gas('lfGetPhotoForOptimization',fileId),optimized=await lfOptimizeImageDataUrl(source.dataUrl);
  if(optimized.sizeBytes>2*1024*1024)throw new Error('The optimized copy is still above 2 MB. Please use a smaller source photo.');
  const saved=await gas('lfSaveOptimizedPhoto',{OriginalFileID:fileId,DataUrl:optimized.dataUrl,Width:optimized.width,Height:optimized.height,ReplaceLinks:!!replaceLinks});
  const file=saved?.file||saved;if(!file?.fileId)throw new Error('The optimized Drive copy was not returned.');
  return file;
}

async function lfAutoRepairOversizedLinkedPhotos(){
  if(LIVEFOODS_AUTO_OPTIMIZING||!LIVEFOODS_DATA)return;
  const pending=[...new Map(lfPhotos().filter(p=>{const n=Number(p.SizeBytes||0);return n>2*1024*1024&&n<=LF_OPTIMIZE_SOURCE_LIMIT_BYTES&&p.FileID}).map(p=>[String(p.FileID),p])).values()];
  if(!pending.length)return;
  LIVEFOODS_AUTO_OPTIMIZING=true;
  let repaired=0;
  try{
    for(const p of pending){
      try{const f=await lfOptimizeDrivePhoto(p.FileID,true);if(Number(f?.replacedLinks||0)>0)repaired++}catch(e){console.warn('Automatic Live Foods photo optimization:',e)}
    }
    if(repaired){
      LIVEFOODS_DATA=null;LIVEFOODS_DRIVE_FILES=null;LIVEFOODS_IMAGE_CACHE={};
      await initLiveFoods(true);
      toast(`${repaired} live-food photo${repaired===1?'':'s'} optimized for web preview`);
    }
  }finally{LIVEFOODS_AUTO_OPTIMIZING=false}
}
async function lfSavePhotoLink(cultureId){
  const payload={CultureID:cultureId,FileID:v('lfPhotoFile'),Category:v('lfPhotoCategory'),Title:v('lfPhotoTitle'),Caption:v('lfPhotoCaption'),IsCover:!!document.getElementById('lfPhotoCover')?.checked};
  const selected=(LIVEFOODS_DRIVE_FILES||[]).find(x=>String(x.fileId)===String(payload.FileID));
  const btn=document.getElementById('lfLinkPhotoBtn');
  let optimized=false;
  try{
    if(btn){btn.disabled=true;btn.textContent='Linking…'}
    if(selected&&!selected.previewReady){
      if(Number(selected.sizeBytes||0)>LF_OPTIMIZE_SOURCE_LIMIT_BYTES)throw new Error(`This photo is ${lfFormatBytes(selected.sizeBytes)}. Automatic optimization supports source photos up to ${lfFormatBytes(LF_OPTIMIZE_SOURCE_LIMIT_BYTES)}.`);
      if(btn)btn.textContent='Optimizing photo…';
      const file=await lfOptimizeDrivePhoto(payload.FileID,false);payload.FileID=file.fileId;optimized=true;
      if(btn)btn.textContent='Linking…';
    }
    await gas('lfSavePhotoLink',payload);
    LIVEFOODS_DATA=null;LIVEFOODS_DRIVE_FILES=null;LIVEFOODS_IMAGE_CACHE={};await initLiveFoods(true);lfOpenPhotoManager(cultureId);toast(optimized?'Photo optimized and linked':'Photo linked');
  }catch(e){toast(errMsg(e),'error');if(btn){btn.disabled=false;btn.textContent='Link photo'}}
}

function fishRoomWorkspaceRackCard(rack){
  const key=frDisplay().rackKeys?.[rack.key]||{A:'rackA202407',B:'rackB202410',C:'rackCCurrent'}[rack.key]||'overview';
  const positions=rack.shelves.reduce((n,s)=>n+s.nums.length,0);
  const present=(DATA.tanks||[]).filter(t=>{const p=physicalInfoByNo(tankNoLocal(t));return p?.rack?.key===rack.key});
  const active=present.filter(t=>!['available','cleaning','unavailable'].includes(String(t.Status||'').toLowerCase())).length;
  const incubatorCount=rack.shelves.filter(s=>s.incubator).reduce((n,s)=>n+s.nums.length,0);
  const detail=rack.key==='A'?'01–20 • 3 shelves':rack.key==='B'?'21–29 • 3 shelves':'30–50 • fry + incubators';
  return `<article class="fishroom-workspace-rack"><div class="fishroom-workspace-rack-photo">${fishRoomSlot(key)}</div><div class="fishroom-workspace-rack-copy"><div class="between"><div><b>${esc(rack.name)}</b><div class="small">${esc(detail)}</div></div><span class="tag">${present.length}/${positions}</span></div><div class="fishroom-rack-meta"><span>${active} active</span>${incubatorCount?`<span>${incubatorCount} incubators</span>`:''}<span>${rack.shelves.length} shelves</span></div><button class="btn" onclick="openFishRoomRack('${rack.key}')">Open rack →</button></div></article>`;
}

function updateFishRoomSlots(){document.querySelectorAll('[data-fishroom-key]').forEach(el=>{const key=el.getAttribute('data-fishroom-key'),src=FISHROOM_IMAGE_CACHE[key];if(src&&!el.querySelector('img'))el.innerHTML=`<img src="${src}" alt="Fish room photo">`})}
async function loadFishRoomImages(keys){
  const m=await fishRoomManifest(),byKey={};(m.photos||[]).forEach(p=>byKey[p.key]=p);
  const pending=[...new Set(keys||[])].filter(k=>byKey[k]&&!FISHROOM_IMAGE_CACHE[k]);
  for(let i=0;i<pending.length;i+=6){
    const batch=pending.slice(i,i+6),ids=[...new Set(batch.map(k=>byKey[k].fileId).filter(Boolean))];if(!ids.length)continue;
    let rows;try{rows=await gas('frGetPhotoImages',ids)}catch(e){rows=await gas('getFishRoomImages',ids)}
    const byId={};(rows||[]).forEach(x=>{if(x?.fileId&&x?.dataUrl)byId[String(x.fileId)]=x.dataUrl});
    batch.forEach(k=>{const id=String(byKey[k]?.fileId||'');if(byId[id])FISHROOM_IMAGE_CACHE[k]=byId[id]});updateFishRoomSlots();
  }
}

  {key:'B',name:'Rack B – Secondary',description:'Small / window rack',shelves:[{label:'Top shelf',nums:[21,22,23]},{label:'Middle shelf',nums:[24,25,26]},{label:'Bottom shelf',nums:[27,28,29]}]},
  {key:'C',name:'Rack C – Right Fry Rack',description:'Fry + incubator rack',shelves:[{label:'Shelf 1',nums:[30,31,32,33,34,35,36]},{label:'Shelf 2',nums:[37,38,39,40,41,42,43]},{label:'Incubator shelf / tray',nums:[44,45,46,47,48,49,50],incubator:true}]}
];
function tankNoLocal(t){const raw=String(t?.TankID||t?.TankName||'');const m=raw.match(/(\d+)/);return m?Number(m[1]):null}
function nextTankNoLocal(){const nums=(DATA.tanks||[]).map(t=>tankNoLocal(t)).filter(n=>Number.isFinite(n));return nums.length?Math.max(...nums)+1:1}
function physicalInfoByNo(n){for(const rack of PHYSICAL_RACKS){for(let si=0;si<rack.shelves.length;si++){const sh=rack.shelves[si],pi=sh.nums.indexOf(n);if(pi>=0)return {rack:rack,rackName:rack.name,shelf:sh,shelfIndex:si+1,position:pi+1,incubator:!!sh.incubator}}}return null}
function physicalRackLabel(t){const x=physicalInfoByNo(tankNoLocal(t));return x?.rackName||t?.Rack||''}
function displayTankType(t){const x=physicalInfoByNo(tankNoLocal(t));return x?.incubator?'Incubator':(t?.TankType||'Adult')}
function physicalPositionLabel(t){const x=physicalInfoByNo(tankNoLocal(t));if(!x)return '';return `${x.shelf.label} • position ${x.position}`}
function suggestedRack(t={}){if(String(t.TankType||'').toLowerCase()==='incubator')return 'Rack C – Right Fry Rack';const n=tankNoLocal(t)??nextTankNoLocal(),x=physicalInfoByNo(n);return x?.rackName||t.Rack||''}
function tankTypeChanged(){const type=v('tanktype'),rack=document.getElementById('rack');if(!rack)return;if(type==='Incubator')rack.value='Rack C – Right Fry Rack';else if(!rack.value)rack.value=suggestedRack({TankID:v('tankid'),TankName:v('tankname'),TankType:type})}
async function applyRackLayout(){try{const r=await gas('applyRackLayoutFast');(r?.changes||[]).forEach(c=>{const t=(DATA.tanks||[]).find(x=>x.TankID===c.TankID);if(t){if(c.Rack)t.Rack=c.Rack;if(c.TankType)t.TankType=c.TankType}});markFastUpdated();if(current==='Tanks')render();toast(`Rack layout updated for ${r?.updated||0} tank(s)`)}catch(e){toast(errMsg(e),'error')}}
function tankVisualClass(t){const st=String(t?.Status||'').toLowerCase();return t?.mixedWarning?'mixed':st==='available'?'available':st==='cleaning'?'cleaning':st==='unavailable'?'unavailable':'occupied'}
function adultCountText(g){const h=Number(g?.HermaphroditeCount||0),m=Number(g?.MaleCount||0),f=Number(g?.FemaleCount||0),u=Number(g?.UnknownCount||0);if(h>0){const p=[h+'H'];if(m)p.push(m+'M');if(f)p.push(f+'F');if(u)p.push(u+'U');return p.join('/')}return `${m}M/${f}F/${u}U`}
function tankFishSummary(t){const adults=t?.currentGroups||[],fry=t?.currentFryGroups||[];if(adults.length)return adults.map(x=>`<i>${esc(speciesName(x.species))}</i><div>${esc(adultCountText(x.group))}</div>`).join('');if(fry.length)return fry.map(x=>`<i>${esc(speciesName(x.species))}</i><div>Fry ${esc(x.group.CurrentCount||x.group.Count||'?')}</div>`).join('');return '<span class="small">No active fish</span>'}
function rackTankTile(t,n,info){if(!t)return `<div class="rack-slot-empty"><b>Tank #${String(n).padStart(2,'0')}</b><div class="rack-pos">${esc(info.shelf.label)} • position ${info.position}</div><div class="small section">Not in database</div></div>`;return `<div class="rack-tank ${tankVisualClass(t)}" onclick="openTankDetail('${t.TankID}')"><div class="between"><b>${esc(t.TankName||('Tank #'+String(n).padStart(2,'0')))}</b><span class="tag">${esc(t.Status||'Unknown')}</span></div><div class="rack-pos">${esc(info.shelf.label)} • position ${info.position}</div><div class="small">${t.VolumeL?esc(t.VolumeL)+' L • ':''}${esc(displayTankType(t))}</div><div class="rack-fish">${tankFishSummary(t)}</div></div>`}
function rackSectionHtml(rack,byNo){return `<div class="rack-section" id="rack-${esc(rack.key)}"><div class="rack-head"><div><h3>${esc(rack.name)}</h3><div class="rack-summary">${esc(rack.description)} • numbering left to right, then down</div></div><span class="tag">${rack.shelves.reduce((n,s)=>n+s.nums.length,0)} positions</span></div>${rack.shelves.map(sh=>`<div class="rack-shelf"><div class="rack-shelf-title">${esc(sh.label)}${sh.incubator?' • incubators':''}</div><div class="rack-shelf-grid" style="grid-template-columns:repeat(${sh.nums.length},132px)">${sh.nums.map((n,pi)=>rackTankTile(byNo[n],n,{shelf:sh,position:pi+1})).join('')}</div></div>`).join('')}</div>`}
function tanksPage(){const byNo={},unassigned=[];(DATA.tanks||[]).forEach(t=>{const n=tankNoLocal(t);if(Number.isFinite(n)&&physicalInfoByNo(n))byNo[n]=t;else unassigned.push(t)});return `<div class="row"><h2 style="flex:1">Tanks by physical rack</h2><button class="btn primary" onclick="tankForm()">+ Tank / Incubator</button></div><div class="v5-rack-jump"><button class="btn" onclick="v5JumpRack('A')">Rack A · Main</button><button class="btn" onclick="v5JumpRack('B')">Rack B · Secondary</button><button class="btn" onclick="v5JumpRack('C')">Rack C · Fry</button></div><div class="card"><b>Physical numbering</b><div class="small section">All racks count from the top-left to the right, then continue on the shelf below. Rack C tanks 44–50 are the incubator shelf / tray.</div></div>${PHYSICAL_RACKS.map(r=>rackSectionHtml(r,byNo)).join('')}${unassigned.length?`<div class="rack-section"><h3>Unassigned / outside mapped positions</h3><div class="grid tankgrid">${unassigned.map(t=>`<div class="card clickable ${tankVisualClass(t)}" onclick="openTankDetail('${t.TankID}')"><div class="between"><b>${esc(t.TankName)}</b><span class="tag">${esc(t.Status||'Unknown')}</span></div><div class="small">${esc(t.Rack||'No rack')} • ${esc(t.TankType||'Adult')}</div>${tankFishSummary(t)}</div>`).join('')}</div></div>`:''}`}

','${t.TankID}')">Edit fish</button><button class="btn danger" onclick="removeAdultForm('${x.group.AdultGroupID}','${t.TankID}')">Remove</button><button class="btn" onclick="openLabel('AdultGroup','${x.group.AdultGroupID}')">Label</button><button class="btn" onclick="moveAdultForm('${x.group.AdultGroupID}')">Move</button></div></div>`).join('')}${fr.map(x=>`<div class="listitem"><div><b>Fry — <i>${esc(speciesName(x.species))}</i></b><br>${esc(x.populationDisplayName||'')}<div class="small">${esc(x.group.FryGroupID)} • ${esc(x.group.Generation||'')} • Count ${esc(x.group.CurrentCount||x.group.Count||'?')}</div></div><div class="row"><button class="btn" onclick="openLabel('FryGroup','${x.group.FryGroupID}')">Label</button><button class="btn" onclick="moveFryForm('${x.group.FryGroupID}')">Move</button></div></div>`).join('')||(!ad.length&&!fr.length?'<span class="small">Tank is empty.</span>':'')}</div><div class="card section"><h3>Actions</h3><div class="row"><button class="btn primary" onclick="placeGroupForm('${t.TankID}')">Place new group</button>${ad.length?`<button class="btn" onclick="eggForm('${t.TankID}')">Collect eggs</button>`:''}<button class="btn" onclick="waterChangeForm('${t.TankID}')">Water change</button><button class="btn" onclick="tankFormById('${t.TankID}')">Edit tank</button><button class="btn" onclick="cycleSetupForm('${t.TankID}')">Edit setup</button><button class="btn" onclick="openLabel('Tank','${t.TankID}')">Tank label</button>${['Cleaning','Unavailable'].includes(t.Status)?`<button class="btn primary" onclick="markReady('${t.TankID}')">Mark ready</button>`:''}<button class="btn danger" onclick="resetForm('${t.TankID}')">Reset</button></div></div><div class="card section"><div class="between"><h3>Last 5 water tests</h3><span id="recentWaterState" class="small"></span></div><div id="recentWaterHost">${recent}</div></div><div class="card section"><div class="between"><h3>Water parameter charts</h3><div class="row"><button class="btn" onclick="setTankChartRange('${t.TankID}',30)">30 days</button><button class="btn" onclick="setTankChartRange('${t.TankID}',90)">90 days</button><button class="btn" onclick="setTankChartRange('${t.TankID}',0)">All</button><label class="inline-check"><input id="allcycles" type="checkbox" onchange="loadTankCharts('${t.TankID}',CURRENT_CHART_DAYS,this.checked)"> all cycles</label></div></div><div id="chartNotice" class="small section">Charts are loaded only when you choose 30 days, 90 days or All.</div><div id="tankCharts" class="grid"><div class="nodata">Choose a chart range above when you need the water history.</div></div></div>`;
}
function cycleSetupForm(tankId){const t=(DATA.tanks||[]).find(x=>x.TankID===tankId)||{},c=t.cycle||{};modal(`<h3>Current setup — ${esc(tankName(tankId))}</h3><div class="small">These values belong to the current tank cycle and remain in history after a reset.</div><div class="formgrid section">${inp('Substrate','csubstrate','text',c.Substrate||'')}${inp('Botanicals','cbotanicals','text',c.Botanicals||'')}${inp('Peat','cpeat','text',c.Peat||'')}${inp('Water depth cm','cdepth','number',c.WaterDepthCm||'')}${inp('Heater','cheater','text',c.Heater||'')}${inp('Lighting','clighting','text',c.Lighting||'')}${ta('Cycle notes','cnotes',c.Notes||'')}</div><div class="row section"><button class="btn primary" onclick="saveCycleSetup('${tankId}')">Save setup</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function saveCycleSetup(tankId){try{

function placeGroupForm(tankId){
  const t=(DATA.tanks||[]).find(x=>x.TankID===tankId);
  if(!t)return toast('Tank not found','error');
  const blocked=['cleaning','unavailable'].includes(String(t.Status||'').toLowerCase())||t.legacyStatus===true;
  const popOpts=populationOptions();
  const firstPop=popOpts.length?popOpts[0].value:'';
  const firstSource=((DATA.populations||[]).find(x=>x.PopulationID===firstPop)||{}).Source||'';
  const readyBox=blocked
    ? `<div id="agReadyBox" class="card" style="margin-bottom:14px"><div class="between"><div><b>${esc(t.TankName)} is ${esc(t.Status||'Unavailable')}</b><div class="small">Make the tank ready here. The information you enter below will stay in this form.</div></div><button class="btn primary" onclick="markReadyFromGroupForm('${tankId}')">Mark ready & continue</button></div><div id="agReadyState" class="small section"></div></div>`
    : '';
  modal(`<h3>Place new adult group in ${esc(tankName(tankId))}</h3>${readyBox}<div class="formgrid">${sel('Population','agpop',popOpts,firstPop,'onchange="updateAdultSourceFromPopulation()"')}${inp('Group name','agname')}${inp('Hermaphrodites','agh','number')}${inp('Males','agm','number')}${inp('Females','agf','number')}${inp('Group / unsexed','agu','number')}${inp('Generation','aggen','text','F0')}${inp('Obtained from / source','agsource','text',firstSource)}<div class="wide small">Source is stored with the selected population (person, breeder, club/show such as Portugal APK, Germany, SKS, etc.).</div><div class="wide"><label class="inline-check"><input id="agmix" type="checkbox"> Allow mixing with another active group</label></div>${ta('Notes','agnotes')}</div><div class="row section"><button id="agPlaceBtn" class="btn primary" onclick="saveAdultGroup('${tankId}')" ${blocked?'disabled':''}>Place group</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
}

async function markReadyFromGroupForm(tankId){try{
  const state=document.getElementById('agReadyState');
  if(state)state.textContent='Marking tank ready…';
  const r=await gas('markTankReadyFast',tankId,new Date().toISOString());
  if(r?.tank)applyFastTankResult(r.tank);
  const box=document.getElementById('agReadyBox');
  if(box)box.innerHTML=`<div><b>${esc(tankName(tankId))} is now Available</b><div class="small">You can continue with the fish information below.</div></div>`;
  const btn=document.getElementById('agPlaceBtn');
  if(btn)btn.disabled=false;
  toast('Tank marked Available');
}catch(e){
  const state=document.getElementById('agReadyState');
  if(state)state.textContent='Could not mark tank ready';
  toast(errMsg(e),'error');
}}

async function saveAdultGroup(tankId){try{
  const popId=v('agpop');
  const source=String(v('agsource')||'').trim();
  const pop=(DATA.populations||[]).find(x=>x.PopulationID===popId);
  if(pop&&source!==String(pop.Source||'').trim()){
    const pr=await gas('savePopulationSourceFast',popId,source);
    if(pr?.population){
      const i=(DATA.populations||[]).findIndex(x=>x.PopulationID===pr.population.PopulationID);
      if(i>=0)DATA.populations[i]=Object.assign({},DATA.populations[i],pr.population);
    }
  }
  const r=await gas('createAdultGroup',{PopulationID:popId,GroupName:v('agname'),MaleCount:v('agm'),FemaleCount:v('agf'),UnknownCount:v('agu'),Generation:v('aggen')||'F0',TankID:tankId,allowMixing:checked('agmix'),Notes:v('agnotes')});
  if(r?.tanks)setTanksLocal(r.tanks);
  if(r?.populations)setPopulationsLocal(r.populations);
  if(r?.group){
    const h=Number(v('agh')||0);
    if(h>0){
      const er=await gas('editAdultGroupFast',{AdultGroupID:r.group.AdultGroupID,HermaphroditeCount:h,MaleCount:v('agm'),FemaleCount:v('agf'),UnknownCount:v('agu'),Reason:'Initial hermaphrodite count'});
      if(er?.group)r.group=er.group;
      if(er?.tank)applyFastTankResult(er.tank);
    }
    const a=DATA.adultGroups||(DATA.adultGroups=[]);
    if(!a.some(x=>x.AdultGroupID===r.group.AdultGroupID))a.push(r.group);
  }
  closeModal();
  invalidateTankDetail(tankId);
  const d=tankDetailLocal(tankId);
  if(d)renderTankDetail(d);
  toast('Group placed');
}catch(e){toast(errMsg(e),'error')}}

  const item=(t?.currentGroups||[]).find(x=>(x.group?.AdultGroupID||x.groupId)===groupId);
  const g=item?.group||(DATA.adultGroups||[]).find(x=>x.AdultGroupID===groupId);
  if(!g)return toast('Adult group not found','error');

    <div class="small">Use this when fish are added to or removed from this same tracked group/population. If the fish are from a different population/locality/line, create a separate group instead.</div>
    <div class="formgrid section">
      ${inp('Hermaphrodites','efh','number',g.HermaphroditeCount??0)}
      ${inp('Males','efm','number',g.MaleCount??0)}
      ${inp('Females','eff','number',g.FemaleCount??0)}
      ${inp('Group / unsexed','efu','number',g.UnknownCount??0)}
      ${inp('Reason','efreason','text','')}
    </div>
    <div class="row section">
      <button class="btn primary" onclick="saveAdultFishEdit('${groupId}','${tankId}')">Save fish count</button>
      <button class="btn" onclick="closeModal()">Cancel</button>

}

async function saveAdultFishEdit(groupId,tankId){try{
  const r=await gas('editAdultGroupFast',{
    AdultGroupID:groupId,
    HermaphroditeCount:v('efh'),
    MaleCount:v('efm'),
    FemaleCount:v('eff'),
    UnknownCount:v('efu'),
    Reason:v('efreason')
  });
  if(r?.group){
    const a=DATA.adultGroups||(DATA.adultGroups=[]);

}catch(e){toast(errMsg(e),'error')}}

  const g=item?.group||(DATA.adultGroups||[]).find(x=>x.AdultGroupID===groupId);

function speciesCollectionState(id){
  const ps=(DATA.populations||[]).filter(p=>p.SpeciesID===id);
  const st=ps.map(p=>String(p.Status||'').toLowerCase());
  if(st.includes('current'))return 'In collection';
  if(st.includes('wishlist'))return 'Wishlist';
  if(st.includes('lost'))return 'Lost';
  if(st.includes('past'))return 'Past';
  if(st.includes('incoming'))return 'Incoming';
  return ps.length?'Review':'Not tracked';
}

function fishTypeLabel(g,isFry){
  if(isFry)return 'Group';
  const h=Number(g?.HermaphroditeCount||0),m=Number(g?.MaleCount||0),f=Number(g?.FemaleCount||0),u=Number(g?.UnknownCount||0);
  const total=h+m+f+u;
  if(total===1&&h===1&&m===0&&f===0&&u===0)return 'Hermaphrodite';
  if(total===1&&m===1&&h===0&&f===0&&u===0)return 'Male';
  if(total===1&&f===1&&h===0&&m===0&&u===0)return 'Female';
  return 'Group';
}

function eggSpeciesId(e){
  const p=(DATA.populations||[]).find(x=>x.PopulationID===e.PopulationID);
  return p?.SpeciesID||'';
}

function frySpeciesOptions(){
  const eggs=(DATA.eggBatches||[]).filter(e=>e.AdultGroupID);
  const ids=[...new Set(eggs.map(eggSpeciesId).filter(Boolean))];
  return ids.map(id=>{
    const s=(DATA.species||[]).find(x=>x.SpeciesID===id);
    return {value:id,label:speciesName(s)||id};
  }).sort((a,b)=>a.label.localeCompare(b.label));
}

let WATER_TODAY=[], WATER_TODAY_DATE='', WATER_RACK='', WATER_SELECTED_TANK='', WATER_EDIT_ID='';
let METER_WINDOW=null, METER_CONNECTED=false, METER_ARMED_TANK='', WATER_SAVE_PENDING=false;
const WATER_SAVED_MESSAGE_IDS=new Set();

function waterRackList(){
  const map={};
  (DATA.tanks||[]).forEach(t=>{const r=String(t.Rack||'Unassigned').trim()||'Unassigned';if(!map[r])map[r]=[];map[r].push(t)});
  return Object.keys(map).sort((a,b)=>Math.min(...map[a].map(waterTankNo))-Math.min(...map[b].map(waterTankNo)));
}
function waterTankNo(t){const m=String(t?.TankID||t?.TankName||'').match(/(\d+)/);return m?Number(m[1]):9999}
function waterShelfLabel(t){
  const n=waterTankNo(t);
  if(n>=1&&n<=7)return'Top';
  if(n>=8&&n<=14)return'Middle';
  if(n>=15&&n<=20)return'Bottom';
  if(n>=21&&n<=23)return'Top';
  if(n>=24&&n<=26)return'Middle';
  if(n>=27&&n<=29)return'Bottom';
  if(n>=30&&n<=36)return'Shelf 1';
  if(n>=37&&n<=43)return'Shelf 2';
  if(n>=44&&n<=50)return'Incubators';
  return String(t?.Position||'Tanks').trim()||'Tanks';
}
function waterRackTanks(){return (DATA.tanks||[]).filter(t=>(String(t.Rack||'Unassigned').trim()||'Unassigned')===WATER_RACK).sort((a,b)=>waterTankNo(a)-waterTankNo(b))}
function waterHas(v){return !(v===undefined||v===null||v==='')}
function waterComplete(t){return t&&['pH','EC_uScm','TDS_ppm','Temperature_C'].every(k=>waterHas(t[k]))}
function waterTestsForTank(id){return WATER_TODAY.filter(x=>String(x.TankID)===String(id)).sort((a,b)=>new Date(a.DateTime)-new Date(b.DateTime))}
function waterLatestForTank(id){const a=waterTestsForTank(id);return a.length?a[a.length-1]:null}
function waterOccupant(t){
  const a=t?.current;
  const f=t?.currentFryGroups?.[0];
  return a?.populationDisplayName||a?.species?.displayName||a?.group?.GroupName||f?.populationDisplayName||f?.species?.displayName||f?.group?.GroupName||'';
}
function waterTime(x){if(!x)return'';const d=new Date(x);return isNaN(d)?String(x):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function waterValue(v,suffix=''){return waterHas(v)?esc(String(v))+suffix:'—'}
function waterTankButton(t){
  const test=waterLatestForTank(t.TankID),selected=String(WATER_SELECTED_TANK)===String(t.TankID);
  const state=test?(waterComplete(test)?'done':'partial'):'pending';
  const icon=test?(waterComplete(test)?'✓':'⚠'):'';
  const no=String(waterTankNo(t)).padStart(2,'0'),occ=waterOccupant(t);
  const disabled=WATER_SAVE_PENDING?' disabled':'';
  return `<button type="button" class="water-tank ${state}${selected?' selected':''}" onclick="selectWaterTank('${esc(t.TankID)}')" title="${esc(t.TankName||t.TankID)}${occ?' — '+esc(occ):''}"${disabled}><span class="water-tank-no">${esc(no)}</span><span class="water-tank-icon">${icon}</span><span class="water-tank-name">${esc(occ||t.Status||'')}</span></button>`;
}
function waterRackGridHtml(){
  const tanks=waterRackTanks();
  if(!tanks.length)return'<div class="small">No tanks are assigned to this rack.</div>';
  const groups=[];
  tanks.forEach(t=>{const name=waterShelfLabel(t);let g=groups.find(x=>x.name===name);if(!g){g={name,tanks:[]};groups.push(g)}g.tanks.push(t)});
  return groups.map(g=>`<div class="water-shelf"><div class="water-shelf-label">${esc(g.name)}</div><div class="water-shelf-grid" style="grid-template-columns:repeat(${Math.max(1,g.tanks.length)},minmax(0,1fr))">${g.tanks.map(waterTankButton).join('')}</div></div>`).join('');
}
function waterProgressHtml(){
  const tanks=waterRackTanks(),ids=new Set(tanks.map(t=>String(t.TankID))),tests=WATER_TODAY.filter(x=>ids.has(String(x.TankID)));
  const measured=new Set(tests.map(x=>String(x.TankID))).size;
  const partial=tanks.filter(t=>{const x=waterLatestForTank(t.TankID);return x&&!waterComplete(x)}).length;
  return `<b>Measured today: ${measured} / ${tanks.length}</b>${partial?`<span class="warntext"> • ${partial} incomplete</span>`:''}`;
}
function waterSelectedHtml(){
  const t=(DATA.tanks||[]).find(x=>String(x.TankID)===String(WATER_SELECTED_TANK));
  if(!t)return'<div class="small">Tap a tank above to select it.</div>';
  const test=waterLatestForTank(t.TankID),occ=waterOccupant(t);
  return `<div class="between"><div><div class="small">Selected tank</div><h3 style="margin:2px 0">${esc(t.TankName||t.TankID)}</h3>${occ?`<div class="small">${esc(occ)}</div>`:''}</div><div class="row"><button class="btn primary" onclick="openBleBridge()">${METER_WINDOW&&!METER_WINDOW.closed?'Open / focus meter':'Open RivuLog Meter'}</button></div></div>${test?`<div class="metricgrid section"><div class="metric"><span>pH</span><b>${waterValue(test.pH)}</b></div><div class="metric"><span>EC</span><b>${waterValue(test.EC_uScm,' µS/cm')}</b></div><div class="metric"><span>TDS</span><b>${waterValue(test.TDS_ppm,' ppm')}</b></div><div class="metric"><span>Temp</span><b>${waterValue(test.Temperature_C,' °C')}</b></div></div><div class="row section"><span class="${waterComplete(test)?'oktext':'warntext'}">${waterComplete(test)?'✓ Measured '+esc(waterTime(test.DateTime)):'⚠ Incomplete measurement '+esc(waterTime(test.DateTime))}</span><button class="btn" onclick="openWaterTestEditor('${esc(test.TestID)}')">Edit / move</button><button class="btn danger" onclick="deleteTodayWaterTest('${esc(test.TestID)}')">Delete</button></div>`:`<div class="small section">Not measured today yet. The tank is ready to send to the meter.</div>`}`;
}
function waterTodayListHtml(){
  const ids=new Set(waterRackTanks().map(t=>String(t.TankID)));
  const rows=WATER_TODAY.filter(x=>ids.has(String(x.TankID))).slice().sort((a,b)=>new Date(b.DateTime)-new Date(a.DateTime));
  if(!rows.length)return'<div class="small">No measurements for this rack today.</div>';
  return rows.map(x=>`<div class="listitem"><div><b>${esc(tankName(x.TankID))}</b> <span class="small">${esc(waterTime(x.DateTime))}</span><div class="small">pH ${waterValue(x.pH)} • EC ${waterValue(x.EC_uScm)} • TDS ${waterValue(x.TDS_ppm)} • ${waterValue(x.Temperature_C,' °C')} ${waterComplete(x)?'':' • ⚠ incomplete'}</div></div><button class="btn" onclick="openWaterTestEditor('${esc(x.TestID)}')">Edit</button></div>`).join('');
}
function renderWaterTesting(){
  if(current!=='Water')return;
  const g=document.getElementById('waterTankGrid');if(g)g.innerHTML=waterRackGridHtml();
  const p=document.getElementById('waterProgress');if(p)p.innerHTML=waterProgressHtml();
  const s=document.getElementById('waterSelectedPanel');if(s)s.innerHTML=waterSelectedHtml();
  const l=document.getElementById('waterTodayList');if(l)l.innerHTML=waterTodayListHtml();
  const ms=document.getElementById('waterMeterState');if(ms){
    if(WATER_SAVE_PENDING)ms.innerHTML='<span class="warntext">● Saving measurement…</span>';
    else if(METER_CONNECTED&&METER_ARMED_TANK)ms.innerHTML=`<span class="oktext">● Meter connected • ${esc(tankName(METER_ARMED_TANK))} armed</span>`;
    else if(METER_CONNECTED)ms.innerHTML='<span class="oktext">● Meter connected</span>';
    else ms.innerHTML='<span class="small">Meter not connected</span>';
  }
}
async function refreshWaterToday(){

function waterRackChanged(){if(WATER_SAVE_PENDING)return toast('Wait until the current measurement is saved.','warn');WATER_RACK=v('waterRack');WATER_SELECTED_TANK='';METER_ARMED_TANK='';renderWaterTesting()}
function selectWaterTank(id){
  if(WATER_SAVE_PENDING)return toast('Wait until the current measurement is saved.','warn');
  WATER_SELECTED_TANK=id;METER_ARMED_TANK='';renderWaterTesting();sendWaterTankToMeter(id);

function sendWaterTankToMeter(id){
  if(!id||!METER_WINDOW||METER_WINDOW.closed)return false;
  try{
    METER_WINDOW.postMessage({type:'RIVULOG_SET_TANK',tankId:id},bleBridgeOrigin());
    const st=document.getElementById('bleReturnState');if(st)st.textContent=`Sending ${tankName(id)} to meter…`;
    return true;
  }catch(e){return false}
}
function waterPage(){
  const tanks=activeTankOptions(),allTanks=(DATA.tanks||[]).map(t=>({value:t.TankID,label:`${t.TankName} — ${t.Status}`}));

async function receiveBleMeasurement(msg,sourceWindow){try{
  if(!msg||msg.type!=='RIVULOG_BLE_MEASUREMENT')return;
  const tank=msg.tankId||WATER_SELECTED_TANK, messageId=String(msg.messageId||'');
  if(!tank)throw new Error('No tank was supplied by RivuLog Meter.');
  if(WATER_SELECTED_TANK&&String(tank)!==String(WATER_SELECTED_TANK))throw new Error(`Meter returned ${tankName(tank)}, but ${tankName(WATER_SELECTED_TANK)} is selected in RivuLog.`);
  if(messageId&&WATER_SAVED_MESSAGE_IDS.has(messageId)){
    try{sourceWindow?.postMessage({type:'RIVULOG_MEASUREMENT_ACK',ok:true,messageId,tankId:tank,duplicate:true},bleBridgeOrigin())}catch(e){}
    return;
  }
  WATER_SAVE_PENDING=true;renderWaterTesting();
  const st=document.getElementById('bleReturnState');if(st)st.textContent=`Saving ${tankName(tank)}…`;
  await gas('addWaterTest',{
    TankID:tank,DateTime:msg.measuredAt||new Date().toISOString(),
    pH:msg.pH,EC_uScm:msg.EC_uScm,TDS_ppm:msg.TDS_ppm,Temperature_C:msg.Temperature_C,
    ORP_mV:'',DO_mgL:'',Salinity_pct:'',
    Notes:`BLE-9908 via RivuLog Meter${msg.stabilizationTimedOut?' • 15s max':msg.stable?' • stable':''}${msg.clipped?' • meter range limit':''}${msg.rawHex?' • raw '+msg.rawHex:''}`,
    Source:'RivuLog BLE direct'
  });
  if(messageId)WATER_SAVED_MESSAGE_IDS.add(messageId);
  markFastUpdated();syncTankCacheInBackground(tank);await refreshWaterToday();
  WATER_SAVE_PENDING=false;renderWaterTesting();
  if(st)st.textContent=`Saved in RivuLog ✓ — ${tankName(tank)} • choose the next grey tank`;
  try{sourceWindow?.postMessage({type:'RIVULOG_MEASUREMENT_ACK',ok:true,messageId,tankId:tank},bleBridgeOrigin())}catch(e){}
  toast(`Measurement saved for ${tankName(tank)}`);
}catch(e){
  WATER_SAVE_PENDING=false;renderWaterTesting();
  const st=document.getElementById('bleReturnState');if(st)st.textContent=`Save failed: ${errMsg(e)}`;
  try{sourceWindow?.postMessage({type:'RIVULOG_MEASUREMENT_ACK',ok:false,messageId:String(msg?.messageId||''),tankId:msg?.tankId||'',error:errMsg(e)},bleBridgeOrigin())}catch(x){}
  toast(errMsg(e),'error');
}}
function handleRivulogMeterMessage(e){
  if(e.origin!==bleBridgeOrigin())return;
  const msg=e.data||{};
  if(msg.type==='RIVULOG_METER_READY'){METER_WINDOW=e.source||METER_WINDOW;if(WATER_SELECTED_TANK)sendWaterTankToMeter(WATER_SELECTED_TANK);return}
  if(msg.type==='RIVULOG_METER_STATUS'){METER_WINDOW=e.source||METER_WINDOW;METER_CONNECTED=msg.status==='connected';if(!METER_CONNECTED)METER_ARMED_TANK='';renderWaterTesting();return}
  if(msg.type==='RIVULOG_TANK_ARMED'){
    METER_WINDOW=e.source||METER_WINDOW;METER_ARMED_TANK=String(msg.tankId||'');
    const st=document.getElementById('bleReturnState');if(st)st.textContent=METER_ARMED_TANK?`Meter confirmed: ${tankName(METER_ARMED_TANK)} armed`:'';
    renderWaterTesting();return;
  }
  if(msg.type==='RIVULOG_TANK_REJECTED'){
    const st=document.getElementById('bleReturnState');if(st)st.textContent=msg.reason||'Meter is still busy saving the previous measurement.';
    toast(msg.reason||'Meter is busy','warn');return;
  }
  if(msg.type==='RIVULOG_BLE_MEASUREMENT')receiveBleMeasurement(msg,e.source);
}

    u.searchParams.set('source','rivulog');

    PRINTER_PENDING={
      type:'RIVULOG_PRINT_LABEL',

    toast('Printer bridge opened — use Connect & Print in that window');
    clearInterval(PRINTER_SEND_TIMER);
    let tries=0;
    PRINTER_SEND_TIMER=setInterval(()=>{
      tries++;
      sendPendingPrinterLabel();
      if(tries>=8){clearInterval(PRINTER_SEND_TIMER);PRINTER_SEND_TIMER=null}

  }catch(e){toast(errMsg(e),'error')}

window.addEventListener('message',e=>{
  if(e.origin!==printerBridgeOrigin())return;
  const m=e.data||{};
  if(m.type==='RIVULOG_PRINTER_READY'){
    sendPendingPrinterLabel();
    return;
  }
  if(m.type==='RIVULOG_PRINTER_RESULT'){
    if(m.ok){
      toast(m.batch ? `Printed ${m.printed||0}/${m.total||0} labels via Bluetooth` : `Printed ${LABEL_STATE?.type||'label'} via Bluetooth`);
      if(!m.batch&&LABEL_STATE){
        gas('recordLabel',{
          LabelType:LABEL_STATE.type,
          RecordID:LABEL_STATE.id,
          Template:'bluetooth-direct',
          ImageFileName:'Bluetooth direct',
          QRCodeText:LABEL_STATE.qr
        }).catch(()=>{});
      }
    }else{
      toast('Printer: '+(m.error||'Print failed'),'error');
    }
  }
});

function batchQrImage(url){
 // QRCode.js normally creates a complete canvas synchronously. Use it directly:
 // no requestAnimationFrame and no extra data-URL image decode on every label.
 return new Promise((resolve,reject)=>{
  const holder=document.createElement('div');
  holder.style.cssText='position:fixed;left:-10000px;top:0;width:160px;height:160px;pointer-events:none';
  document.body.appendChild(holder);
  let finished=false;
  const cleanup=()=>{if(holder.parentNode)holder.remove()};
  const ok=el=>{if(finished)return;finished=true;clearTimeout(timer);cleanup();resolve(el)};
  const fail=msg=>{if(finished)return;finished=true;clearTimeout(timer);cleanup();reject(new Error(msg))};
  const timer=setTimeout(()=>fail('QR image generation timed out after 8 seconds.'),8000);
  try{
   new QRCode(holder,{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
   const canvas=holder.querySelector('canvas');
   if(canvas&&canvas.width>0&&canvas.height>0){ok(canvas);return}
   const img=holder.querySelector('img');
   if(!img){fail('The QR library did not produce an image.');return}
   if(img.complete&&img.naturalWidth>0){ok(img);return}
   img.onload=()=>ok(img);
   img.onerror=()=>fail('QR image could not load.');
  }catch(e){fail(e.message||String(e))}
 });
}
